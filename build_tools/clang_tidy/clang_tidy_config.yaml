---
# Focused tests enable the designated-initializer policy while implementation
# sources are migrated to satisfy it.
Checks: '-*,iree-*,-iree-cpp-designated-initializer,-iree-unbounded-recursion,readability-braces-around-statements'
HeaderFilterRegex: '.*'
ExcludeHeaderFilterRegex: '(^|/)(external|third_party)/'
...
