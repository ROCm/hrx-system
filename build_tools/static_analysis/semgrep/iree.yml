rules:
  - id: iree.c.no-goto-error-handling
    languages:
      - c
    severity: ERROR
    message: >-
      C runtime code uses scoped status handling and terminal cleanup
      blocks instead of goto-based error handling.
    pattern-regex: "\\bgoto\\s+[A-Za-z_][A-Za-z0-9_]*\\s*;"
    paths:
      include:
        - /runtime/src/iree/**/*.c
        - /loom/src/loom/**/*.c
        - /libamdf/**/*.c

  - id: iree.tests.raw-status-is-ok-expectation
    languages:
      - cpp
    severity: WARNING
    message: >-
      Status-owning test assertions should use IREE_EXPECT_OK, IREE_ASSERT_OK,
      IREE_EXPECT_STATUS_IS, or IREE_ASSERT_STATUS_IS so failure paths consume
      the status cleanly and print useful diagnostics.
    pattern-either:
      - pattern: EXPECT_TRUE(iree_status_is_ok($STATUS))
      - pattern: ASSERT_TRUE(iree_status_is_ok($STATUS))
      - pattern: EXPECT_FALSE(iree_status_is_ok($STATUS))
      - pattern: ASSERT_FALSE(iree_status_is_ok($STATUS))
    paths:
      include:
        - /runtime/src/iree/**/*test.cc
        - /runtime/src/iree/**/*_test.h
        - /loom/src/loom/**/*test.cc
        - /loom/src/loom/**/*_test.h
        - /libhrx/**/*test.cc
        - /libhrx/**/*_test.h

  - id: iree.cpp.no-designated-initializer-suppression
    languages:
      - generic
    severity: ERROR
    message: >-
      C++ implementation sources must satisfy the designated-initializer
      policy without suppressing iree-cpp-designated-initializer.
    pattern-regex: >-
      NOLINT(?:BEGIN|END|NEXTLINE)?\s*\([^)]*\biree-cpp-designated-initializer\b[^)]*\)
    paths:
      include:
        - /runtime/**/*.cc
        - /runtime/**/*.cpp
        - /runtime/**/*.cxx
        - /loom/**/*.cc
        - /loom/**/*.cpp
        - /loom/**/*.cxx
        - /libamdf/**/*.cc
        - /libamdf/**/*.cpp
        - /libamdf/**/*.cxx
        - /libhrx/**/*.cc
        - /libhrx/**/*.cpp
        - /libhrx/**/*.cxx

  - id: iree.loom.target-diagnostics-are-target-generic
    languages:
      - python
    severity: ERROR
    message: >-
      TARGET diagnostics are target-generic. Move architecture- or
      vendor-specific semantics to the owning error domain.
    pattern-regex: >-
      (?i)\b(?:amd(?:gpu|gcn|64)?|rdna[0-9a-z._-]*|cdna[0-9a-z._-]*|gcn|gfx[0-9][0-9a-z._-]*|rocm|aie[0-9a-z._-]*|xdna[0-9a-z._-]*|x86[0-9a-z._-]*|sse[0-9a-z._-]*|avx[0-9a-z._-]*|wasm|webassembly|spir-?v|vulkan|nvidia|cuda|ptx|risc-?v|aarch64|arm(?:32|64)?|neon|intel|apple|metal)\b
    paths:
      include:
        - /loom/py/loom/error/target.py
