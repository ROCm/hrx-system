# Rewrites replace the input URL list. Retain the declared GitHub URL first so
# healthy downloads keep their existing route. Bazel checks every fallback
# against the dependency's pinned checksum before extracting or applying patches.
rewrite (github\.com/.*) $1

# GitHub source archives normally redirect to codeload. A direct request gives
# connection failures another attempt without going through github.com again.
rewrite github\.com/([^/]+/[^/]+)/archive/(.+)\.tar\.gz codeload.github.com/$1/tar.gz/$2

# These pinned release assets match their tag archives; recheck when updating
# their pins. Other release assets may contain generated files and differ.
rewrite github\.com/(bazel-contrib/rules_python|bazelbuild/rules_cc|bazelbuild/rules_shell|bazelbuild/rules_testing|google/googletest)/releases/download/([^/]+)/[^/]+\.tar\.gz codeload.github.com/$1/tar.gz/refs/tags/$2

# Bazel's public mirror also carries these release archives, including packaged
# assets whose bytes differ from the corresponding source tag archives.
rewrite (github\.com/(bazelbuild/(bazel-skylib|platforms|rules_shell|rules_testing)|google/googletest|facebook/zstd)/releases/download/[^/]+/[^/]+\.tar\.gz) mirror.bazel.build/$1

# Retain the declared raw-file URL before trying independent endpoints.
rewrite (raw\.githubusercontent\.com/.*) $1

# Raw files from the Linux tree can use its canonical kernel.org mirror.
rewrite raw\.githubusercontent\.com/torvalds/linux/([^/]+)/(.*) git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/$2?id=$1

# The remaining pinned raw-file repositories are mirrored by jsDelivr.
rewrite raw\.githubusercontent\.com/(amd/xdna-driver|ROCm/rocm-systems)/([^/]+)/(.*) cdn.jsdelivr.net/gh/$1@$2/$3
