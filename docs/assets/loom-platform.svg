<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1710" viewBox="0 0 1600 1710" role="img" aria-labelledby="title description">
  <title id="title">Loom platform architecture</title>
  <desc id="description">Loom services host source-defined models and use the compiler and shared execution libraries. C++ source, Loom IR text, and bytecode feed a shared compiler for AMD GPU, XDNA NPU, SPIR-V, and x86 targets. The compiler C API supports independent embedding and artifact emission. The shared runtime supplies executable loading, asynchronous execution, memory management, and CPU, AMD GPU, XDNA, and Vulkan HAL implementations. Native AMD access uses libamdf; Vulkan uses the system driver. The libhrx and HIP APIs are additional clients of the shared runtime.</desc>
