name: CI IREE CMake

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ci_iree_cmake.yml"
      - ".github/scripts/**"
      - "BUILDING.md"
      - "CMakeLists.txt"
      - "MODULE.cmake.lock"
      - "dev.py"
      - "requirements-analysis.in"
      - "requirements-analysis.lock.txt"
      - "requirements-dev.in"
      - "requirements-dev.lock.txt"
      - "build_tools/**"
      - "runtime/**"
      - "loom/**"
      - "third_party/**"
      - "tools/**"
  push:
    branches:
      - main
      - main-staging
    paths:
      - ".github/workflows/ci_iree_cmake.yml"
      - ".github/scripts/**"
      - "BUILDING.md"
      - "CMakeLists.txt"
      - "MODULE.cmake.lock"
      - "dev.py"
      - "requirements-analysis.in"
      - "requirements-analysis.lock.txt"
      - "requirements-dev.in"
      - "requirements-dev.lock.txt"
      - "build_tools/**"
      - "runtime/**"
      - "loom/**"
      - "third_party/**"
      - "tools/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux_cmake_cpu:
    name: ${{ matrix.name }}
    runs-on: azure-linux-scale-rocm
    timeout-minutes: 45
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / CPU
            command: iree-cmake-cpu
            install_compiler_rt: false
          - name: Linux / CPU / Sanitizer Smoke
            command: iree-cmake-sanitizer-smoke
            install_compiler_rt: true
    env:
      AR: ar
      CC: clang
      CXX: clang++
      HRX_ARTIFACT_SET: core
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/build/iree-cmake/downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}/build/iree-cmake
      HRX_PYTHON: ${{ github.workspace }}/build/iree-cmake/python/bin/python3
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}/build/iree-cmake/rocm-root
      PIP_CACHE_DIR: ${{ github.workspace }}/build/iree-cmake/caches/pip
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Clang sanitizer runtimes
        if: matrix.install_compiler_rt
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-rt-18-dev

      - name: Fetch ROCm toolchain
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Install developer tools
        run: |
          python3 --version
          python3 dev.py cmake setup --venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check tool versions
        run: |
          cmake --version
          ctest --version
          ninja --version
          bash .github/scripts/check_host_toolchain.sh
          bash .github/scripts/check_rocm_device_toolchain.sh
          test -d "${HRX_ROCM_ROOT}/include"

      - name: Run IREE CMake CI
        run: |
          echo "python3 build_tools/devtools/ci.py ${{ matrix.command }} --keep-going"
          python3 build_tools/devtools/ci.py ${{ matrix.command }} --keep-going

  windows_cmake:
    name: ${{ matrix.name }}
    runs-on: azure-windows-scale-rocm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / Repository / MSVC Build
            command: iree-cmake-repository-build
            host_toolchain: msvc
            fetch_rocm: false
          - name: Windows / CPU
            command: iree-cmake-cpu
            host_toolchain: clang-cl
            fetch_rocm: true
    env:
      HRX_ARTIFACT_SET: core
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}\build\iree-cmake-windows\downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}\build\iree-cmake-windows
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}\build\iree-cmake-windows\rocm-root
      IREE_CI_PYTHON: python
      PIP_CACHE_DIR: ${{ github.workspace }}\build\iree-cmake-windows\caches\pip
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Fetch ROCm toolchain
        if: matrix.fetch_rocm
        run: |
          python -m pip install --upgrade boto3 zstandard
          python build_tools/ci/ci_core_windows.py fetch-rocm

      - name: Install developer tools
        shell: pwsh
        run: |
          python --version
          python dev.py cmake setup --venv
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Run IREE CMake CI
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%i"
          if not defined VS_INSTALL exit /b 1
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if "${{ matrix.host_toolchain }}"=="msvc" (
            set "CC=cl.exe"
            set "CXX=cl.exe"
            set "AR=lib.exe"
          ) else (
            if not exist "%HRX_ROCM_ROOT%\lib\llvm\bin\clang-cl.exe" exit /b 1
            if not exist "%HRX_ROCM_ROOT%\lib\llvm\bin\llvm-lib.exe" exit /b 1
            set "CC=%HRX_ROCM_ROOT%\lib\llvm\bin\clang-cl.exe"
            set "CXX=%HRX_ROCM_ROOT%\lib\llvm\bin\clang-cl.exe"
            set "AR=%HRX_ROCM_ROOT%\lib\llvm\bin\llvm-lib.exe"
          )
          python build_tools/devtools/ci.py ${{ matrix.command }} --keep-going

  linux_cmake_vulkan:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, Linux, X64, gpu_navi4x]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Vulkan
            command: iree-cmake-vulkan
    env:
      AR: ${{ github.workspace }}/build/iree-cmake-vulkan/rocm-root/lib/llvm/bin/llvm-ar
      CC: ${{ github.workspace }}/build/iree-cmake-vulkan/rocm-root/lib/llvm/bin/clang
      CXX: ${{ github.workspace }}/build/iree-cmake-vulkan/rocm-root/lib/llvm/bin/clang++
      HRX_ARTIFACT_SET: core
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/build/iree-cmake-vulkan/downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}/build/iree-cmake-vulkan
      HRX_PYTHON: ${{ github.workspace }}/build/iree-cmake-vulkan/python/bin/python3
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}/build/iree-cmake-vulkan/rocm-root
      PIP_CACHE_DIR: ${{ github.workspace }}/build/iree-cmake-vulkan/caches/pip
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Fetch ROCm toolchain
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Check Vulkan hardware environment
        timeout-minutes: 1
        run: bash .github/scripts/check_vulkan_hardware_environment.sh

      - name: Install CMake host tools
        run: |
          python3 --version
          "${HRX_PYTHON}" -m pip install --upgrade cmake==3.31.6 ninja
          echo "${HRX_OUTPUT_DIR}/python/bin" >> "$GITHUB_PATH"

      - name: Check tool versions
        run: |
          cmake --version
          ctest --version
          ninja --version
          bash .github/scripts/check_host_toolchain.sh --expect-rocm
          bash .github/scripts/check_rocm_device_toolchain.sh
          test -d "${HRX_ROCM_ROOT}/include"

      - name: Run IREE CMake CI
        run: |
          echo "python3 build_tools/devtools/ci.py ${{ matrix.command }} --keep-going"
          python3 build_tools/devtools/ci.py ${{ matrix.command }} --keep-going

  linux_cmake_amdgpu:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner_label }}
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: >-
        --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --ulimit memlock=-1:-1
        --security-opt seccomp=unconfined
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        --user 0:0
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / AMDGPU / gfx942
            command: iree-cmake-amdgpu
            runner_label: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            target_selector: gfx942
    env:
      AR: ${{ github.workspace }}/build/iree-cmake-gpu/rocm-root/lib/llvm/bin/llvm-ar
      CC: ${{ github.workspace }}/build/iree-cmake-gpu/rocm-root/lib/llvm/bin/clang
      CXX: ${{ github.workspace }}/build/iree-cmake-gpu/rocm-root/lib/llvm/bin/clang++
      HRX_ARTIFACT_SET: core
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/build/iree-cmake-gpu/downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}/build/iree-cmake-gpu
      HRX_PYTHON: ${{ github.workspace }}/build/iree-cmake-gpu/python/bin/python3
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}/build/iree-cmake-gpu/rocm-root
      PIP_CACHE_DIR: ${{ github.workspace }}/build/iree-cmake-gpu/caches/pip
      ROCR_VISIBLE_DEVICES: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: |
          mkdir -p "$HOME"
          git config --global --add safe.directory "$PWD"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Fetch ROCm toolchain
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Install developer tools
        run: |
          python3 --version
          python3 dev.py cmake setup --venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check tool versions
        run: |
          cmake --version
          ctest --version
          ninja --version
          bash .github/scripts/check_host_toolchain.sh --expect-rocm
          bash .github/scripts/check_rocm_device_toolchain.sh
          test -d "${HRX_ROCM_ROOT}/include"

      - name: Report ROCm environment
        timeout-minutes: 1
        run: bash .github/scripts/check_rocm_environment.sh

      - name: Run IREE CMake CI
        run: |
          echo "python3 build_tools/devtools/ci.py ${{ matrix.command }} --amdgpu-target ${{ matrix.target_selector }} --keep-going"
          python3 build_tools/devtools/ci.py ${{ matrix.command }} \
            --amdgpu-target "${{ matrix.target_selector }}" --keep-going
