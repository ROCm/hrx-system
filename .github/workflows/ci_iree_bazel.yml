name: CI IREE Bazel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".bazelrc"
      - ".bazelrc.configured"
      - ".github/scripts/**"
      - ".github/workflows/ci_iree_bazel.yml"
      - "BUILD.bazel"
      - "BUILDING.md"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "dev.py"
      - "requirements-analysis.in"
      - "requirements-analysis.lock.txt"
      - "requirements-dev.in"
      - "requirements-dev.lock.txt"
      - "build_tools/**"
      - "runtime/**"
      - "loom/**"
      - "third_party/**"
      - "tools/**"
  push:
    branches:
      - main
      - main-staging
    paths:
      - ".bazelrc"
      - ".bazelrc.configured"
      - ".github/scripts/**"
      - ".github/workflows/ci_iree_bazel.yml"
      - "BUILD.bazel"
      - "BUILDING.md"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "dev.py"
      - "requirements-analysis.in"
      - "requirements-analysis.lock.txt"
      - "requirements-dev.in"
      - "requirements-dev.lock.txt"
      - "build_tools/**"
      - "runtime/**"
      - "loom/**"
      - "third_party/**"
      - "tools/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux_bazel_cpu:
    name: ${{ matrix.name }}
    runs-on: azure-linux-scale-rocm
    timeout-minutes: 45
    container:
      image: ${{ matrix.container_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / CPU
            command: iree-bazel-cpu
            container_image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
            host_ar: ar
            host_cc: clang
            host_cxx: clang++
            install_compiler_rt: false
            setup_python: true
          - name: Linux / CPU / ASAN
            command: iree-bazel-cpu-asan
            container_image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
            host_ar: ar
            host_cc: clang
            host_cxx: clang++
            install_compiler_rt: true
            setup_python: true
          - name: Linux / CPU / MSAN
            command: iree-bazel-cpu-msan
            container_image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
            host_ar: ar
            host_cc: clang
            host_cxx: clang++
            install_compiler_rt: true
            setup_python: true
          - name: Linux / CPU / TSAN
            command: iree-bazel-cpu-tsan
            container_image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
            host_ar: ar
            host_cc: clang
            host_cxx: clang++
            install_compiler_rt: true
            setup_python: true
          - name: Linux / CPU / UBSAN
            command: iree-bazel-cpu-ubsan
            container_image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
            host_ar: ar
            host_cc: clang
            host_cxx: clang++
            install_compiler_rt: true
            setup_python: true
          - name: Linux / Repository / GCC Build
            command: iree-bazel-repository-build
            container_image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
            host_ar: ar
            host_cc: gcc
            host_cxx: g++
            install_compiler_rt: false
            setup_python: false
    env:
      AR: ${{ matrix.host_ar }}
      CC: ${{ matrix.host_cc }}
      CXX: ${{ matrix.host_cxx }}
      HRX_ARTIFACT_SET: core
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/build/iree-bazel/downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}/build/iree-bazel
      HRX_PYTHON: ${{ github.workspace }}/build/iree-bazel/python/bin/python3
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}/build/iree-bazel/rocm-root
      PIP_CACHE_DIR: ${{ github.workspace }}/build/iree-bazel/caches/pip
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Set up Python
        if: matrix.setup_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Clang sanitizer runtimes
        if: matrix.install_compiler_rt
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-rt-18-dev

      - name: Fetch ROCm toolchain
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Install developer tools
        run: |
          python3 --version
          python3 dev.py bazel setup --venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check tool versions
        run: |
          bazel --version
          bash .github/scripts/check_host_toolchain.sh
          bash .github/scripts/check_rocm_device_toolchain.sh
          test -d "${HRX_ROCM_ROOT}/include"

      - name: Run IREE Bazel CI
        id: iree_bazel_ci
        run: |
          echo "python3 build_tools/devtools/ci.py ${{ matrix.command }} --bazel-profile-dir ${RUNNER_TEMP}/bazel-profiles --keep-going"
          python3 build_tools/devtools/ci.py ${{ matrix.command }} \
            --bazel-profile-dir "${RUNNER_TEMP}/bazel-profiles" --keep-going

      - name: Upload Bazel profiles
        if: ${{ always() && steps.iree_bazel_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-profiles-${{ matrix.command }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-profiles/*.profile.gz
          if-no-files-found: error
          compression-level: 0

  windows_bazel:
    name: ${{ matrix.name }}
    runs-on: azure-windows-scale-rocm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / Repository / clang-cl + ROCm
            host_toolchain: clang-cl
          - name: Windows / Repository / MSVC + ROCm
            host_toolchain: msvc
    env:
      BAZEL_LLVM: ${{ github.workspace }}\build\iree-bazel-windows\rocm-root\lib\llvm
      HRX_ARTIFACT_SET: core
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}\build\iree-bazel-windows\downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}\build\iree-bazel-windows
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}\build\iree-bazel-windows\rocm-root
      IREE_CI_PYTHON: python
      PIP_CACHE_DIR: ${{ github.workspace }}\build\iree-bazel-windows\caches\pip
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Fetch ROCm toolchain
        run: |
          python -m pip install --upgrade boto3 zstandard
          python build_tools/ci/ci_core_windows.py fetch-rocm

      - name: Install developer tools
        shell: pwsh
        run: |
          $bazelOutputRoot = (Join-Path $env:SystemDrive "b").Replace('\', '/')
          "startup --output_user_root=$bazelOutputRoot" |
            Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          if ("${{ matrix.host_toolchain }}" -eq "msvc") {
            "build --config=windows-msvc" |
              Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          }
          python --version
          python dev.py bazel setup --venv
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Run IREE Bazel CI
        id: iree_bazel_ci
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%i"
          if not defined VS_INSTALL exit /b 1
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if "${{ matrix.host_toolchain }}"=="msvc" (
            set "CC=cl.exe"
            set "CXX=cl.exe"
            set "AR=lib.exe"
          ) else (
            if not exist "%BAZEL_LLVM%\bin\clang-cl.exe" exit /b 1
            if not exist "%BAZEL_LLVM%\bin\lld-link.exe" exit /b 1
            if not exist "%BAZEL_LLVM%\bin\llvm-lib.exe" exit /b 1
            set "CC=%BAZEL_LLVM%\bin\clang-cl.exe"
            set "CXX=%BAZEL_LLVM%\bin\clang-cl.exe"
            set "AR=%BAZEL_LLVM%\bin\llvm-lib.exe"
          )
          python build_tools/devtools/ci.py iree-bazel-repository-integration --amdgpu-target gfx11-generic --bazel-profile-dir "%RUNNER_TEMP%\bazel-profiles" --keep-going

      - name: Upload Bazel profiles
        if: ${{ always() && steps.iree_bazel_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-profiles-iree-bazel-repository-integration-${{ matrix.host_toolchain }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}\bazel-profiles\*.profile.gz
          if-no-files-found: error
          compression-level: 0

  linux_bazel_vulkan:
    name: Linux / Vulkan
    runs-on: linux-gfx120X-gpu-rocm
    timeout-minutes: 45
    env:
      AR: ar
      CC: gcc
      CXX: g++
      IREE_VULKAN_ALLOWED_DEVICE_IDS: "1002:7550 1002:7551"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Check Vulkan hardware environment
        timeout-minutes: 1
        run: bash .github/scripts/check_vulkan_hardware_environment.sh

      - name: Install Bazel host tools
        run: |
          python3 --version
          python3 dev.py bazel setup --venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check tool versions
        run: |
          bazel --version
          "${CC}" --version
          "${CXX}" --version
          "${AR}" --version

      - name: Run IREE Bazel CI
        id: iree_bazel_ci
        run: |
          echo "python3 build_tools/devtools/ci.py iree-bazel-vulkan --bazel-profile-dir ${RUNNER_TEMP}/bazel-profiles --keep-going"
          python3 build_tools/devtools/ci.py iree-bazel-vulkan \
            --bazel-profile-dir "${RUNNER_TEMP}/bazel-profiles" --keep-going

      - name: Upload Bazel profiles
        if: ${{ always() && steps.iree_bazel_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-profiles-iree-bazel-vulkan-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-profiles/*.profile.gz
          if-no-files-found: error
          compression-level: 0

  linux_bazel_amdgpu:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner_label }}
    continue-on-error: ${{ matrix.optional }}
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: >-
        --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --ulimit memlock=-1:-1
        --security-opt seccomp=unconfined
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        --user 0:0
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / AMDGPU / gfx942
            command: iree-bazel-amdgpu
            optional: false
            runner_label: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            target_selector: gfx942
          - name: Linux / AMDGPU / gfx110X
            command: iree-bazel-amdgpu
            optional: false
            runner_label: linux-gfx110X-gpu-rocm
            target_selector: gfx110X-all
          - name: Linux / AMDGPU / gfx1150
            command: iree-bazel-amdgpu
            optional: true
            runner_label: linux-gfx1150-gpu-rocm
            target_selector: gfx1150
          - name: Linux / AMDGPU / gfx1151
            command: iree-bazel-amdgpu
            optional: true
            runner_label: linux-gfx1151-gpu-rocm
            target_selector: gfx1151
          - name: Linux / AMDGPU / gfx120X
            command: iree-bazel-amdgpu
            optional: false
            runner_label: linux-gfx120X-gpu-rocm
            target_selector: gfx120X-all
          - name: Linux / AMDGPU / gfx942 / ASAN
            command: iree-bazel-amdgpu-asan
            optional: false
            runner_label: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            target_selector: gfx942
          - name: Linux / AMDGPU / gfx942 / TSAN
            command: iree-bazel-amdgpu-tsan
            optional: false
            runner_label: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            target_selector: gfx942
          - name: Linux / AMDGPU / gfx942 / UBSAN
            command: iree-bazel-amdgpu-ubsan
            optional: false
            runner_label: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            target_selector: gfx942
    env:
      AR: ${{ github.workspace }}/build/iree-bazel-gpu/rocm-root/lib/llvm/bin/llvm-ar
      CC: ${{ github.workspace }}/build/iree-bazel-gpu/rocm-root/lib/llvm/bin/clang
      CXX: ${{ github.workspace }}/build/iree-bazel-gpu/rocm-root/lib/llvm/bin/clang++
      HRX_ARTIFACT_SET: core
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/build/iree-bazel-gpu/downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}/build/iree-bazel-gpu
      HRX_PYTHON: ${{ github.workspace }}/build/iree-bazel-gpu/python/bin/python3
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}/build/iree-bazel-gpu/rocm-root
      PIP_CACHE_DIR: ${{ github.workspace }}/build/iree-bazel-gpu/caches/pip
      ROCR_VISIBLE_DEVICES: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: |
          mkdir -p "$HOME"
          git config --global --add safe.directory "$PWD"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Fetch ROCm toolchain
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Install developer tools
        run: |
          python3 --version
          python3 dev.py bazel setup --venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check tool versions
        run: |
          bazel --version
          bash .github/scripts/check_host_toolchain.sh --expect-rocm
          bash .github/scripts/check_rocm_device_toolchain.sh
          test -d "${HRX_ROCM_ROOT}/include"

      - name: Report ROCm environment
        timeout-minutes: 1
        run: bash .github/scripts/check_rocm_environment.sh

      - name: Run IREE Bazel CI
        id: iree_bazel_ci
        run: |
          echo "python3 build_tools/devtools/ci.py ${{ matrix.command }} --amdgpu-target ${{ matrix.target_selector }} --bazel-profile-dir ${RUNNER_TEMP}/bazel-profiles --keep-going"
          python3 build_tools/devtools/ci.py ${{ matrix.command }} \
            --amdgpu-target "${{ matrix.target_selector }}" \
            --bazel-profile-dir "${RUNNER_TEMP}/bazel-profiles" --keep-going

      - name: Upload Bazel profiles
        if: ${{ always() && steps.iree_bazel_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-profiles-${{ matrix.command }}-${{ matrix.target_selector }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-profiles/*.profile.gz
          if-no-files-found: error
          compression-level: 0

  linux_bazel_amdgpu_binary_analysis:
    name: Linux / AMDGPU / Binary Analysis
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: azure-linux-scale-rocm
    timeout-minutes: 30
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    concurrency:
      group: iree-bazel-binary-analysis-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      actions: read
      contents: read
    env:
      AR: ${{ github.workspace }}/build/iree-bazel-binary-analysis/rocm-root/lib/llvm/bin/llvm-ar
      BINARY_ANALYSIS_ENVIRONMENT_ID: therock-manylinux-x86_64-sha256-702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
      CC: ${{ github.workspace }}/build/iree-bazel-binary-analysis/rocm-root/lib/llvm/bin/clang
      CXX: ${{ github.workspace }}/build/iree-bazel-binary-analysis/rocm-root/lib/llvm/bin/clang++
      HRX_ARTIFACT_SET: core-with-llvm-dev
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/build/iree-bazel-binary-analysis/downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}/build/iree-bazel-binary-analysis
      HRX_PYTHON: ${{ github.workspace }}/build/iree-bazel-binary-analysis/python/bin/python3
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}/build/iree-bazel-binary-analysis/rocm-root
      PIP_CACHE_DIR: ${{ github.workspace }}/build/iree-bazel-binary-analysis/caches/pip
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Fetch ROCm LLVM toolchain
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Install developer tools
        run: |
          python3 --version
          python3 dev.py bazel setup --venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check toolchain
        run: |
          python3 dev.py bazel doctor
          bash .github/scripts/check_host_toolchain.sh --expect-rocm
          "${HRX_ROCM_ROOT}/lib/llvm/bin/llvm-readobj" --version
          "${HRX_ROCM_ROOT}/lib/llvm/bin/llvm-strip" --version

      - name: Recover Loom product-size history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          CURRENT_MAIN_SHA: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          SIZE_WORK_DIR: build/iree-bazel-binary-analysis/loom-size/work
        run: |
          args=(
            --repo-root "$PWD"
            --repository "${GITHUB_REPOSITORY}"
            --anchor "${BASE_SHA}"
            --output "${SIZE_WORK_DIR}/baseline.json"
          )
          if [[ -n "${CURRENT_MAIN_SHA}" ]]; then
            args+=(--exclude-commit "${CURRENT_MAIN_SHA}")
          fi
          python3 build_tools/ci/loom_binary_size.py fetch-history "${args[@]}"

      - name: Build and measure Loom products
        env:
          SIZE_WORK_DIR: build/iree-bazel-binary-analysis/loom-size/work
        run: |
          python3 build_tools/ci/loom_binary_size.py collect \
            --repo-root "$PWD" \
            --output-dir "${SIZE_WORK_DIR}" \
            --llvm-bin "${HRX_ROCM_ROOT}/lib/llvm/bin" \
            --environment-id "${BINARY_ANALYSIS_ENVIRONMENT_ID}" \
            --commit "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            --run-id "${GITHUB_RUN_ID}"

      - name: Render Loom product-size history
        env:
          SIZE_RECORD_DIR: build/iree-bazel-binary-analysis/loom-size/record
          SIZE_WORK_DIR: build/iree-bazel-binary-analysis/loom-size/work
          UPDATE_MAIN: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
        run: |
          args=(
            --current "${SIZE_WORK_DIR}/current.json"
            --baseline "${SIZE_WORK_DIR}/baseline.json"
            --output-dir "${SIZE_RECORD_DIR}"
          )
          if [[ -n "${UPDATE_MAIN}" ]]; then
            args+=(--update-main)
          fi
          python3 build_tools/ci/loom_binary_size.py report "${args[@]}"
          cat "${SIZE_RECORD_DIR}/summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Loom product-size record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'loom-binary-size-history-main-v1' || format('loom-binary-size-candidate-{0}', github.run_id) }}
          path: build/iree-bazel-binary-analysis/loom-size/record/
          if-no-files-found: error
          overwrite: true
          retention-days: 45
