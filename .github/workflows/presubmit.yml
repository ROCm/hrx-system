name: HRX

on:
  workflow_dispatch:
  merge_group:
    types:
      - checks_requested
    branches:
      - main
  pull_request:
  push:
    branches:
      - main-staging

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  presubmit:
    name: Presubmit
    runs-on: azure-linux-scale-rocm
    timeout-minutes: 45
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    env:
      AR: ${{ github.workspace }}/build/presubmit/rocm-root/lib/llvm/bin/llvm-ar
      CC: ${{ github.workspace }}/build/presubmit/rocm-root/lib/llvm/bin/clang
      CXX: ${{ github.workspace }}/build/presubmit/rocm-root/lib/llvm/bin/clang++
      HRX_ARTIFACT_SET: core-with-llvm-dev
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/build/presubmit/downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}/build/presubmit
      HRX_PYTHON: ${{ github.workspace }}/build/presubmit/python/bin/python3
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}/build/presubmit/rocm-root
      IREE_CLANG_TIDY_LLVM_ROOT: ${{ github.workspace }}/build/presubmit/rocm-root/lib/llvm
      IREE_CLANG_TIDY_REQUIRED: "1"
      PIP_CACHE_DIR: ${{ github.workspace }}/build/presubmit/caches/pip
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Fetch ROCm LLVM toolchain
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Install developer tools
        run: |
          python3 --version
          python3 dev.py bazel setup --venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check tool versions
        run: |
          python3 dev.py bazel doctor
          bash .github/scripts/check_host_toolchain.sh --expect-rocm
          "${IREE_CLANG_TIDY_LLVM_ROOT}/bin/clang-tidy" --version
          "${IREE_CLANG_TIDY_LLVM_ROOT}/bin/llvm-config" --version
          "${IREE_CLANG_TIDY_LLVM_ROOT}/bin/clang++" --version
          test -d "${HRX_ROCM_ROOT}/lib/llvm/include"

      - name: Run presubmit
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 dev.py bazel presubmit \
              --profile ci \
              --no-project-tests \
              --base "${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            python3 dev.py bazel presubmit \
              --profile ci \
              --no-project-tests \
              --base "${{ github.event.merge_group.base_sha }}"
          else
            python3 dev.py bazel presubmit \
              --profile ci \
              --no-project-tests
          fi

      - name: Run core Linux smoke
        if: github.event_name == 'merge_group'
        run: python3 build_tools/devtools/ci.py iree-bazel-cpu --keep-going
