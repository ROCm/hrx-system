name: Loom / SDK / Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-loom-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: Validate / Release identity
    runs-on: ubuntu-24.04
    outputs:
      release_channel: ${{ steps.release.outputs.release_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the canonical release tag and catalog
        id: release
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo 'Select a release tag when dispatching this workflow.' >&2
            exit 1
          fi
          release_channel=$(
            python3 loom/packaging/python/release.py check-tag "$GITHUB_REF_NAME"
          )
          echo "release_channel=$release_channel" >> "$GITHUB_OUTPUT"

  build_release:
    name: Release
    needs: identity
    uses: $/.github/workflows/build_loom_sdk.yml
    with:
      profile: Release
    permissions:
      actions: read
      contents: read

  build_tracy:
    name: Tracy
    needs: identity
    uses: $/.github/workflows/build_loom_sdk.yml
    with:
      profile: Tracy
    permissions:
      actions: read
      contents: read

  build_debug:
    name: Debug
    needs: identity
    uses: $/.github/workflows/build_loom_sdk.yml
    with:
      profile: Debug
    permissions:
      actions: read
      contents: read

  build_asan:
    name: ASAN
    needs: identity
    uses: $/.github/workflows/build_loom_sdk.yml
    with:
      profile: ASAN
    permissions:
      actions: read
      contents: read

  security:
    name: Security / Native production
    needs: identity
    uses: $/.github/workflows/codeql_cpp.yml
    permissions:
      contents: read
      security-events: write

  bundle:
    name: Bundle / Verify artifact set
    needs: [build_release, build_tracy, build_debug, build_asan, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loom-sdk-wheel-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loom-standalone-archive-*
          merge-multiple: true
          path: release-assets
      - name: Verify release identities and record exact bytes
        run: |
          python3 loom/packaging/python/release.py bundle release-assets --tag="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loom-sdk-checksums
          path: release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  github:
    name: Publish / GitHub assets
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loom-sdk-wheel-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loom-standalone-archive-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loom-sdk-checksums
          path: release-assets
      - name: Publish the verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m build_tools.ci.loom_release github --tag="$GITHUB_REF_NAME"

  pypi:
    name: Publish / PyPI wheels
    needs: [identity, github]
    if: needs.identity.outputs.release_channel == 'stable'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/hrx-loom
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loom-sdk-wheel-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loom-standalone-archive-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loom-sdk-checksums
          path: release-assets
      - name: Check PyPI retry state and stage missing normal wheels
        id: pypi
        run: |
          python3 -m build_tools.ci.loom_release pypi-stage \
            --tag="$GITHUB_REF_NAME" --output=pypi-assets
      - name: Publish with OIDC
        if: steps.pypi.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-assets
          attestations: true
          print-hash: true

  advance_development:
    name: Complete / Advance main development
    needs: [identity, pypi]
    if: needs.identity.outputs.release_channel == 'stable'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare the next development identity
        id: advance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          identity=loom/packaging/python/version.json
          python3 loom/packaging/python/release.py \
            --identity="$identity" advance-development \
            --released-tag="$RELEASE_TAG"
          if git diff --quiet -- "$identity"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          next_version=$(python3 -c \
            'import json, sys; print(json.load(open(sys.argv[1]))["package-version"])' \
            "$identity")
          {
            echo "changed=true"
            echo "next_version=$next_version"
            echo "branch=automation/loom-sdk-$RELEASE_TAG-post-release"
          } >> "$GITHUB_OUTPUT"
      - name: Open the post-release development pull request
        if: steps.advance.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.advance.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.advance.outputs.next_version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          identity=loom/packaging/python/version.json
          pull_request=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all \
            --head "$BRANCH" --json state,url \
            --jq '.[0] | select(. != null) | [.state, .url] | @tsv')
          if [[ -n "$pull_request" ]]; then
            read -r state url <<< "$pull_request"
            if [[ "$state" == OPEN ]]; then
              echo "Post-release pull request already exists: $url"
              exit 0
            fi
            echo "Reserved branch already has a closed pull request: $url" >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            changed_paths=$(git diff --name-only "origin/main...origin/$BRANCH")
            if [[ "$changed_paths" != "$identity" ]] || \
                ! cmp -s <(git show "origin/$BRANCH:$identity") "$identity"; then
              echo "Reserved branch does not contain the expected identity-only change" >&2
              exit 1
            fi
          else
            next_release=${NEXT_VERSION%.dev0}
            released_version=${RELEASE_TAG#v}
            git switch -c "$BRANCH"
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$identity"
            git commit -m \
              "[Loom] Advance SDK development identity to $next_release" \
              -m "Advance main beyond the published $released_version SDK.
          Preserve the independently qualified model catalog."
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          next_release=${NEXT_VERSION%.dev0}
          released_version=${RELEASE_TAG#v}
          body=$(printf '%s\n\n%s\n\n%s' \
            "Advances the main-branch SDK identity to \`$NEXT_VERSION\` after the immutable $released_version release completed." \
            "Post-release development artifacts therefore identify a new version instead of reusing published version metadata for different bytes." \
            "The independently qualified model catalog remains unchanged. This draft neither selects a release source nor begins another publication.")
          gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main \
            --head "$BRANCH" \
            --title "[Loom] Advance SDK development identity to $next_release" \
            --body "$body"
