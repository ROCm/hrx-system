name: Loom / SDK / Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-loom-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: Validate / Release identity
    runs-on: ubuntu-24.04
    outputs:
      release_channel: ${{ steps.release.outputs.release_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the canonical release tag and catalog
        id: release
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo 'Select a release tag when dispatching this workflow.' >&2
            exit 1
          fi
          release_channel=$(
            python3 loom/packaging/python/release.py check-tag "$GITHUB_REF_NAME"
          )
          echo "release_channel=$release_channel" >> "$GITHUB_OUTPUT"

  build_release:
    name: Release
    needs: identity
    uses: $/.github/workflows/build_loom_sdk.yml
    with:
      profile: Release
    permissions:
      actions: read
      contents: read

  build_tracy:
    name: Tracy
    needs: identity
    uses: $/.github/workflows/build_loom_sdk.yml
    with:
      profile: Tracy
    permissions:
      actions: read
      contents: read

  build_debug:
    name: Debug
    needs: identity
    uses: $/.github/workflows/build_loom_sdk.yml
    with:
      profile: Debug
    permissions:
      actions: read
      contents: read

  build_asan:
    name: ASAN
    needs: identity
    uses: $/.github/workflows/build_loom_sdk.yml
    with:
      profile: ASAN
    permissions:
      actions: read
      contents: read

  security:
    name: Security / Native production
    needs: identity
    uses: $/.github/workflows/codeql_cpp.yml
    permissions:
      contents: read
      security-events: write

  bundle:
    name: Bundle / Verify artifact set
    needs: [build_release, build_tracy, build_debug, build_asan, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loom-sdk-wheel-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loom-server-archive-*
          merge-multiple: true
          path: release-assets
      - name: Verify release identities and record exact bytes
        run: |
          python3 loom/packaging/python/release.py bundle release-assets --tag="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loom-sdk-checksums
          path: release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  github:
    name: Publish / GitHub assets
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loom-sdk-wheel-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loom-server-archive-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loom-sdk-checksums
          path: release-assets
      - name: Upload only absent matching release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m build_tools.ci.loom_release github --tag="$GITHUB_REF_NAME"

  pypi:
    name: Publish / PyPI wheels
    needs: [identity, github]
    if: needs.identity.outputs.release_channel == 'stable'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/hrx-loom
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loom-sdk-wheel-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loom-server-archive-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loom-sdk-checksums
          path: release-assets
      - name: Check PyPI retry state and stage missing normal wheels
        id: pypi
        run: |
          python3 -m build_tools.ci.loom_release pypi-stage \
            --tag="$GITHUB_REF_NAME" --output=pypi-assets
      - name: Publish with OIDC
        if: steps.pypi.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-assets
          attestations: true
          print-hash: true
