name: Loom / SDK / Build

on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: Release
    outputs:
      documentation:
        description: Whether this build produced the GitHub Pages artifact.
        value: ${{ jobs.build.outputs.documentation }}

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Linux + Windows x86-64 / Clang
    runs-on: az-linux-scale-rocm-default-prod
    outputs:
      documentation: ${{ inputs.profile == 'Release' && steps.scope.outputs.loom_docs || 'false' }}
    # Two complete SDK builds normally take 5-9 minutes on this pool. Retain a
    # finite hang bound without treating ordinary fleet variance as a failure.
    timeout-minutes: 15
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
    defaults:
      run:
        shell: bash
    env:
      LLVM_APT_VERSION: "1:22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80"
      CC: /usr/bin/clang-22
      CXX: /usr/bin/clang++-22
      AR: /usr/bin/llvm-ar-22
      LLVM_ROOT: /usr/lib/llvm-22
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure workspace
        run: |
          git config --global --add safe.directory "$PWD"
          {
            echo "WINDOWS_CROSS_ROOT=$PWD/build/loom-sdk/toolchain"
            echo "WINSDK_ROOT=$PWD/build/loom-sdk/toolchain/sdk"
            echo "WINDOWS_COMPILER_RT_ROOT=$PWD/build/loom-sdk/toolchain/compiler-rt"
          } >> "$GITHUB_ENV"
      - name: Select documentation build
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 build_tools/ci/change_scope.py --base "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Install compiler and host tools
        run: |
          case "$PROFILE" in Release|Tracy|Debug|ASAN) ;; *) exit 2 ;; esac
          curl --fail --location --silent --show-error \
            https://apt.llvm.org/llvm-snapshot.gpg.key --output "$RUNNER_TEMP/llvm.asc"
          echo "8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d  $RUNNER_TEMP/llvm.asc" | sha256sum --check
          sudo install -m 644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "clang-22=$LLVM_APT_VERSION" "lld-22=$LLVM_APT_VERSION" \
            "llvm-22=$LLVM_APT_VERSION" "libclang-rt-22-dev=$LLVM_APT_VERSION" \
            g++-13 patchelf p7zip-full python3-venv
          mkdir -p build/loom-sdk/host-tools
          /usr/bin/python3 build_tools/devtools/install.py bazelisk --bin-dir build/loom-sdk/host-tools
          echo "$PWD/build/loom-sdk/host-tools" >> "$GITHUB_PATH"
          echo "$LLVM_ROOT/bin" >> "$GITHUB_PATH"
      - name: Restore Windows SDK inputs
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WINDOWS_CROSS_ROOT }}
          key: windows-cross-${{ hashFiles('.github/scripts/setup_windows_cross.sh', '.github/scripts/windows-sdk-channel.json', 'build_tools/ci/windows_stl_asan.py') }}
      - name: Prepare Windows SDK inputs
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: bash .github/scripts/setup_windows_cross.sh
      - name: Cache Windows SDK inputs
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WINDOWS_CROSS_ROOT }}
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: Select matching Windows compiler runtime
        run: |
          test "$("$LLVM_ROOT/bin/clang" -dumpversion)" = 22.1.8
          resource_dir="$("$LLVM_ROOT/bin/clang" -print-resource-dir)"
          sudo install -D "$WINDOWS_COMPILER_RT_ROOT/clang_rt.builtins-x86_64.lib" \
            "$resource_dir/lib/windows/clang_rt.builtins-x86_64.lib"
      - name: Build and qualify Linux SDK
        run: |
          /usr/bin/python3 -m build_tools.ci.loom_wheel build \
            --profile="${PROFILE,,}" --platform=manylinux_2_39_x86_64 \
            --output=build/loom-sdk/linux --bazel=bazel -- \
            --cxxopt=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13 \
            --linkopt=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13
          # Distribution Python works without loader overrides, which the
          # installed-product test clears to verify the wheel's own linkage.
          /usr/bin/python3 -m build_tools.ci.loom_wheel test \
            --inputs=build/loom-sdk/linux --output=wheel-artifact
      - name: Qualify standalone Linux amdf-info from the SDK
        if: inputs.profile == 'Release'
        run: |
          /usr/bin/python3 -m build_tools.ci.amdf_info_archive \
            --wheel wheel-artifact/*.whl --output=amdf-info-artifact
      - name: Build documentation C examples
        if: inputs.profile == 'Release' && steps.scope.outputs.loom_docs == 'true'
        run: |
          bazel build --config=loom-sdk --config=opt \
            --cxxopt=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13 \
            --linkopt=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13 \
            //loom/binding/c/example:jit_task_pool \
            //loom/binding/c/example:link_modules \
            //loom/binding/c/example:product_frontier
      - name: Build documentation from the qualified SDK
        if: inputs.profile == 'Release' && steps.scope.outputs.loom_docs == 'true'
        env:
          LOOM_DOCS_C_EXAMPLE_DIR: ${{ github.workspace }}/bazel-bin/loom/binding/c/example
          LOOM_DOCS_TOOL_DIR: ${{ github.workspace }}/.venv/bin
        run: |
          /usr/bin/python3 dev.py setup --docs
          .venv/bin/python -m pip install --no-deps wheel-artifact/*.whl
          PYTHONPATH=loom/docs .venv/bin/python -m unittest \
            loom_docs.highlight_test
          .venv/bin/python loom/docs/build.py build \
            --site-dir build/loom-pages/loom
          test -f build/loom-pages/loom/index.html
          test -f build/loom-pages/loom/reference/dialects/index.html
          test -f build/loom-pages/loom/reference/c-api/generated/index.html
      - name: Upload Pages artifact
        if: inputs.profile == 'Release' && steps.scope.outputs.loom_docs == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/loom-pages
          retention-days: 7
      - name: Build and qualify standalone Linux server
        if: inputs.profile == 'Release'
        run: |
          /usr/bin/python3 -m build_tools.ci.loom_server build \
            --platform=manylinux_2_39_x86_64 --commit="$GITHUB_SHA" \
            --output=build/loom-sdk/server/linux --llvm-bin="$LLVM_ROOT/bin" \
            --bazel=bazel -- \
            --cxxopt=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13 \
            --linkopt=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13
          /usr/bin/python3 -m build_tools.ci.loom_server qualify \
            --platform=manylinux_2_39_x86_64 --commit="$GITHUB_SHA" \
            --inputs=build/loom-sdk/server/linux --output=server-artifact
      - name: Cross-build Windows SDK
        run: |
          /usr/bin/python3 -m build_tools.ci.loom_wheel build \
            --profile="${PROFILE,,}" --platform=win_amd64 \
            --output="build/loom-sdk/windows/$PROFILE" --bazel=bazel -- \
            --config=windows-x86_64
      - name: Cross-build standalone Windows server
        if: inputs.profile == 'Release'
        run: |
          /usr/bin/python3 -m build_tools.ci.loom_server build \
            --platform=win_amd64 --commit="$GITHUB_SHA" \
            --output=build/loom-sdk/server/windows --llvm-bin="$LLVM_ROOT/bin" \
            --bazel=bazel
      - name: Qualify native artifact security
        run: |
          wheels=()
          for wheel in wheel-artifact/*.whl build/loom-sdk/windows/"$PROFILE"/*.whl; do
            wheels+=(--wheel "$wheel")
          done
          /usr/bin/python3 -m build_tools.ci.native_artifact_security \
            --llvm-readobj "$LLVM_ROOT/bin/llvm-readobj" "${wheels[@]}"
      - name: Measure release artifacts
        if: inputs.profile == 'Release'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          history_args=()
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            history_args+=(--exclude-commit "$GITHUB_SHA")
          fi
          /usr/bin/python3 -m build_tools.ci.loom_binary_size fetch-history \
            --repository "$GITHUB_REPOSITORY" --anchor "$BASE_SHA" \
            --output build/loom-sdk/size/baseline.json "${history_args[@]}"
          wheels=()
          for wheel in wheel-artifact/*.whl build/loom-sdk/windows/"$PROFILE"/*.whl; do
            wheels+=(--wheel "$wheel")
          done
          /usr/bin/python3 -m build_tools.ci.loom_binary_size collect \
            "${wheels[@]}" --output-dir build/loom-sdk/size \
            --llvm-bin "$LLVM_ROOT/bin" \
            --environment-id ubuntu24-clang22-gcc13-winsdk26100-crt14.44.17.14 \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" --run-id "$GITHUB_RUN_ID"
          report_args=()
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            report_args+=(--update-main)
          fi
          /usr/bin/python3 -m build_tools.ci.loom_binary_size report \
            --current build/loom-sdk/size/current.json \
            --baseline build/loom-sdk/size/baseline.json \
            --output-dir build/loom-sdk/size/record "${report_args[@]}"
          cat build/loom-sdk/size/record/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload qualified Linux wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loom-sdk-wheel-linux-${{ inputs.profile }}
          path: wheel-artifact/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - name: Upload qualified standalone Linux executables
        if: inputs.profile == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loom-standalone-archive-linux-${{ inputs.profile }}
          path: |
            server-artifact/*.zip
            amdf-info-artifact/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - name: Hand Windows artifacts to native qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loom-sdk-inputs-windows-${{ inputs.profile }}
          path: build/loom-sdk/windows/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - name: Hand standalone Windows server to native qualification
        if: inputs.profile == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loom-server-inputs-windows-${{ inputs.profile }}
          path: build/loom-sdk/server/windows/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - name: Upload release-size history
        if: inputs.profile == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'loom-binary-size-history-main-v2' || format('loom-binary-size-candidate-{0}', github.run_id) }}
          path: build/loom-sdk/size/record/
          if-no-files-found: error
          retention-days: 45
          overwrite: true
