name: CI CMake Linux

on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        options:
          - nightly
          - dev
          - prerelease
        default: nightly
      run_id:
        type: string
        description: "TheRock artifact run id. Empty means latest complete Linux run."
        default: ""
      artifact_set:
        type: choice
        options:
          - core
          - core-with-llvm-dev
          - core-with-upstream-hip
        default: core
      test_gpu:
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
      - main-staging

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  cmake_linux:
    name: Linux / CMake / CI
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Default
            sanitizer: none
            assertions: false
            run_tests: true
            ctest_exclude_regex: ""
            cmake_options: |
              -DIREE_HAL_DRIVER_AMDXDNA=ON
            package: true
          - variant: AMDXDNA Host
            sanitizer: none
            assertions: false
            run_tests: true
            ctest_exclude_regex: ""
            cmake_options: |
              -DIREE_HAL_DRIVER_AMDGPU=OFF
              -DIREE_HAL_DRIVER_AMDXDNA=ON
              -DLIBHRX_BUILD_PASSTHROUGH=OFF
              -DIREE_HAL_AMDGPU_TARGETS=
            package: false
          - variant: ASAN
            sanitizer: asan
            assertions: true
            run_tests: true
            ctest_exclude_regex: ""
            package: false
          - variant: TSAN
            sanitizer: tsan
            assertions: true
            run_tests: true
            # TODO(#19): io_uring CTS core_tests hangs under TSAN on the
            # current managed Linux CI runner. Keep this as a CI-only exclusion
            # so local/source coverage remains intact.
            ctest_exclude_regex: "^iree/async/platform/io_uring/cts/core_tests$"
            package: false
          - variant: UBSAN
            sanitizer: ubsan
            assertions: true
            run_tests: true
            ctest_exclude_regex: ""
            package: false
    uses: ./.github/workflows/build_core_linux.yml
    permissions:
      contents: read
    with:
      name: ${{ matrix.variant }}
      release_type: ${{ inputs.release_type || 'nightly' }}
      run_id: ${{ inputs.run_id || '' }}
      artifact_set: ${{ inputs.artifact_set || 'core' }}
      build_type: RelWithDebInfo
      sanitizer: ${{ matrix.sanitizer }}
      assertions: ${{ matrix.assertions }}
      test_gpu: ${{ inputs.test_gpu || false }}
      run_tests: ${{ matrix.run_tests }}
      ctest_exclude_regex: ${{ matrix.ctest_exclude_regex }}
      ctest_label_exclude_regex: "runtime-resource=|manual"
      cmake_options: |
        -DIREE_HAL_AMDGPU_TARGETS=gfx942;gfx1151;gfx1201
        ${{ matrix.cmake_options }}
      package: ${{ matrix.package }}

  # gfx942 builds the tests it runs, because downloading the multi-gigabyte test
  # package on this runner pool does not reliably finish inside a job timeout.
  # The cmake_linux gate stays even though no artifact is consumed: GPU runners
  # are scarce, so a compile failure should surface on the build pool first.
  gpu_linux_gfx942:
    name: Linux / CMake / GPU gfx942
    needs: cmake_linux
    if: ${{ needs.cmake_linux.result == 'success' }}
    uses: ./.github/workflows/test_core_linux_gpu_source.yml
    permissions:
      contents: read
    with:
      name: Linux / CMake / GPU gfx942
      runner_labels: '["linux-gfx942-1gpu-ccs-csp-ossci-rocm"]'
      release_type: ${{ inputs.release_type || 'nightly' }}
      run_id: ${{ inputs.run_id || '' }}
      artifact_set: ${{ inputs.artifact_set || 'core' }}
      amdgpu_targets: gfx942
      device: gpu:0
      ctest_exclude_regex: ""
      ctest_label_regex: runtime-resource=amd-gpu
      ctest_label_exclude_regex: manual
      ctest_parallelism: 1
      experimental: false

  # gfx1201 downloads and runs the packages built by cmake_linux, so every pull
  # request still answers whether the shipped packages extract and run on a
  # machine that did not build them. It is the only job that asks that question.
  gpu_linux_gfx1201:
    name: Linux / CMake / GPU gfx1201
    needs: cmake_linux
    if: ${{ needs.cmake_linux.result == 'success' }}
    uses: ./.github/workflows/test_core_linux_gpu.yml
    permissions:
      actions: read
      contents: read
    with:
      name: Linux / CMake / GPU gfx1201
      runner_labels: '["self-hosted", "Linux", "X64", "gpu_navi4x"]'
      artifact_run_id: ${{ github.run_id }}
      device: gpu:0
      ctest_exclude_regex: ""
      ctest_label_regex: runtime-resource=amd-gpu
      ctest_label_exclude_regex: manual
      ctest_parallelism: 1
      experimental: false

  gpu_linux_gfx1151:
    name: Linux / CMake / AMDXDNA gfx1151
    needs: cmake_linux
    if: ${{ needs.cmake_linux.result == 'success' }}
    uses: ./.github/workflows/test_core_linux_gpu.yml
    permissions:
      actions: read
      contents: read
    with:
      name: Linux / CMake / AMDXDNA gfx1151
      runner_labels: '["linux-gfx1151-gpu-rocm"]'
      artifact_run_id: ${{ github.run_id }}
      device: gpu:0
      ctest_exclude_regex: ""
      ctest_label_regex: runtime-resource=amd-npu
      ctest_label_exclude_regex: manual
      ctest_parallelism: 1
      experimental: false

  summary:
    name: Linux / CMake / CI / Summary
    needs:
      - cmake_linux
      - gpu_linux_gfx942
      - gpu_linux_gfx1201
      - gpu_linux_gfx1151
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check matrix result
        run: |
          result="${{ needs.cmake_linux.result }}"
          echo "cmake_linux result: ${result}"
          if [[ "${result}" != "success" ]]; then
            exit 1
          fi
          result="${{ needs.gpu_linux_gfx942.result }}"
          echo "gpu_linux_gfx942 result: ${result}"
          if [[ "${result}" != "success" ]]; then
            exit 1
          fi
          result="${{ needs.gpu_linux_gfx1201.result }}"
          echo "gpu_linux_gfx1201 result: ${result}"
          if [[ "${result}" != "success" ]]; then
            exit 1
          fi
          result="${{ needs.gpu_linux_gfx1151.result }}"
          echo "gpu_linux_gfx1151 result: ${result}"
          if [[ "${result}" != "success" ]]; then
            exit 1
          fi
