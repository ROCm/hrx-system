name: LibHRX

on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        options:
          - nightly
          - dev
          - prerelease
        default: nightly
      run_id:
        type: string
        description: "TheRock artifact run id. Empty means the latest complete run."
        default: ""
      artifact_set:
        type: choice
        options:
          - core
          - core-with-llvm-dev
          - core-with-upstream-hip
        default: core
  pull_request:
    paths: &libhrx_paths
      - ".bazelrc"
      - ".bazelrc.configured"
      - ".github/scripts/**"
      - ".github/workflows/ci_libhrx.yml"
      - "BUILD.bazel"
      - "BUILDING.md"
      - "CMakeLists.txt"
      - "MODULE.*"
      - "dev.py"
      - "requirements-analysis*"
      - "requirements-dev*"
      - "build_tools/**"
      - "runtime/**"
      - "libhrx/**"
      - "libamdf/**"
      - "third_party/**"
  push:
    branches:
      - main
      - main-staging
    paths: *libhrx_paths

concurrency:
  group: libhrx-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  cmake_linux:
    name: CMake / Linux x86-64 / Clang / RelWithDebInfo
    if: github.event_name != 'push'
    concurrency:
      group: libhrx-cmake-linux-${{ (github.event_name == 'push' && github.ref) || github.run_id }}
      cancel-in-progress: true
    runs-on: az-linux-scale-rocm-default-prod
    timeout-minutes: 30
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    env:
      HRX_OUTPUT_DIR: ${{ github.workspace }}/build/linux
      HRX_RELEASE_TYPE: ${{ inputs.release_type || 'nightly' }}
      HRX_RUN_ID: ${{ inputs.run_id || '' }}
      HRX_ARTIFACT_SET: ${{ inputs.artifact_set || 'core' }}
      HRX_ROCM_ROOT: ${{ github.workspace }}/build/linux/rocm-root
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/build/linux/downloads
      HRX_BUILD_DIR: ${{ github.workspace }}/build/linux/build/hrx-core
      HRX_BUILD_TYPE: RelWithDebInfo
      HRX_BUILD_LOOM: "false"
      HRX_SANITIZER: none
      HRX_ASSERTIONS: "false"
      HRX_CMAKE_OPTIONS: "-DIREE_HAL_AMDGPU_TARGETS=gfx942;gfx1151;gfx1201"
      HRX_CTEST_REGEX: "^(libamdf/cts/core/query_dynamic|libhrx/cts/tests/status/hrx_cts_status)$"
      HRX_CTEST_EXCLUDE_REGEX: ""
      HRX_CTEST_LABEL_REGEX: ""
      HRX_CTEST_LABEL_EXCLUDE_REGEX: "runtime-resource=|manual"
      HRX_TEST_GPU: "false"
      HRX_PACKAGE: "false"
      HRX_PACKAGE_SMOKE: "false"
      PIP_CACHE_DIR: ${{ github.workspace }}/build/linux/caches/pip
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade boto3 cmake==4.4.4 zstandard

      - name: Fetch ROCm artifacts
        run: python3 build_tools/ci/ci_core_linux.py fetch-rocm

      - name: Configure LibHRX products
        run: python3 build_tools/ci/ci_core_linux.py build

      - name: Build and test product boundaries
        id: core_tests
        run: python3 build_tools/ci/ci_core_linux.py test

      - name: Upload failed test results
        if: ${{ always() && steps.core_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-results-libhrx-linux-attempt-${{ github.run_attempt }}
          path: |
            build/linux/**/Testing/Temporary/
            build/linux/**/*_test_tmpdir/test.xml
          if-no-files-found: warn
          retention-days: 7

  bazel_linux:
    name: Bazel / Linux x86-64 / Clang / Fastbuild
    concurrency:
      group: libhrx-bazel-linux-${{ (github.event_name == 'push' && github.ref) || github.run_id }}
      cancel-in-progress: true
    runs-on: az-linux-scale-rocm-default-prod
    timeout-minutes: 45
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    env:
      AR: ${{ github.workspace }}/build/libhrx-bazel/rocm-root/lib/llvm/bin/llvm-ar
      CC: ${{ github.workspace }}/build/libhrx-bazel/rocm-root/lib/llvm/bin/clang
      CXX: ${{ github.workspace }}/build/libhrx-bazel/rocm-root/lib/llvm/bin/clang++
      HRX_ARTIFACT_SET: core
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/build/libhrx-bazel/downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}/build/libhrx-bazel
      HRX_PYTHON: ${{ github.workspace }}/build/libhrx-bazel/python/bin/python3
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}/build/libhrx-bazel/rocm-root
      PIP_CACHE_DIR: ${{ github.workspace }}/build/libhrx-bazel/caches/pip
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Fetch ROCm toolchain
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Install developer tools
        run: |
          python3 --version
          python3 dev.py bazel setup --venv
          echo "$PWD/.venv/bin" >> "${GITHUB_PATH}"

      - name: Check tool versions
        run: |
          bazel --version
          bash .github/scripts/check_host_toolchain.sh --expect-rocm
          bash .github/scripts/check_rocm_device_toolchain.sh
          test -d "${HRX_ROCM_ROOT}/include"

      - name: Configure LibHRX Bazel
        run: |
          python3 dev.py bazel configure \
            -DIREE_HAL_DRIVER_AMDGPU=OFF \
            -DIREE_HAL_DRIVER_AMD_GPU=ON \
            -DIREE_HAL_DRIVER_AMD_XDNA=OFF \
            -DAMDF_BUILD=ON \
            -DIREE_ROCM_PATH="${HRX_ROCM_ROOT}" \
            -DIREE_ROCM_DEPENDENCY_MODE=package

      - name: Build and test LibHRX host coverage
        run: >-
          python3 dev.py bazel test
          --test_tag_filters=-runtime-resource=amd-gpu
          --keep_going //libhrx/...
