name: Loom / SDK

on:
  workflow_call:
    inputs:
      profiles:
        type: string
        default: '["Release"]'
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Profiles as JSON: ["Release", "Tracy", "Debug", "ASAN"]'
        type: string
        default: '["Release"]'

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build_loom_sdk_artifacts.yml
    with:
      profiles: ${{ inputs.profiles }}

  windows:
    name: Windows x86-64 / Installed SDK
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: loom-sdk-inputs-windows-*
          merge-multiple: true
          path: wheel-inputs
      - name: Qualify the cross-built wheels
        shell: pwsh
        run: |
          foreach ($inputs in Get-ChildItem wheel-inputs -Directory) {
            python -m build_tools.ci.loom_wheel test `
              --inputs $inputs.FullName --output wheel-artifact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload qualified Windows wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loom-sdk-wheel-windows
          path: wheel-artifact/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
