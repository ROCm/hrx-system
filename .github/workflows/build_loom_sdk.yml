name: Loom / SDK

on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: Release
  workflow_dispatch:
    inputs:
      profile:
        description: SDK build profile
        type: choice
        options: [Release, Tracy, Debug, ASAN]
        default: Release

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build
    uses: $/.github/workflows/build_loom_sdk_artifacts.yml
    with:
      profile: ${{ inputs.profile }}

  windows:
    name: Qualify / Windows x86-64
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loom-sdk-inputs-windows-${{ inputs.profile }}
          path: wheel-inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.profile == 'Release'
        with:
          name: loom-server-inputs-windows-${{ inputs.profile }}
          path: server-inputs
      - name: Qualify the cross-built wheel
        shell: pwsh
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          python -m build_tools.ci.loom_wheel test `
            --inputs "wheel-inputs/$env:PROFILE" --output wheel-artifact
          exit $LASTEXITCODE
      - name: Qualify the cross-built standalone server
        if: inputs.profile == 'Release'
        shell: pwsh
        run: |
          python -m build_tools.ci.loom_server qualify `
            --platform=win_amd64 --commit="$env:GITHUB_SHA" `
            --inputs=server-inputs --output=server-artifact
          exit $LASTEXITCODE
      - name: Upload qualified Windows wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loom-sdk-wheel-windows-${{ inputs.profile }}
          path: wheel-artifact/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - name: Upload qualified standalone Windows server
        if: inputs.profile == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loom-server-archive-windows-${{ inputs.profile }}
          path: server-artifact/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
