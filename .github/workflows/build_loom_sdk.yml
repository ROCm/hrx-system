name: Loom / SDK

on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: Release
  workflow_dispatch:
    inputs:
      profile:
        description: SDK build profile
        type: choice
        options: [Release, Tracy, Debug, ASAN]
        default: Release

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build
    uses: $/.github/workflows/build_loom_sdk_artifacts.yml
    with:
      profile: ${{ inputs.profile }}

  windows:
    name: Qualify / Windows x86-64
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: loom-sdk-inputs-windows-${{ inputs.profile }}
          path: wheel-inputs
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: inputs.profile == 'Release'
        with:
          name: loom-server-inputs-windows-${{ inputs.profile }}
          path: server-inputs
      - name: Qualify the cross-built wheel
        shell: pwsh
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          python -m build_tools.ci.loom_wheel test `
            --inputs "wheel-inputs/$env:PROFILE" --output wheel-artifact
          exit $LASTEXITCODE
      - name: Qualify the cross-built standalone server
        if: inputs.profile == 'Release'
        shell: pwsh
        run: |
          python -m build_tools.ci.loom_server qualify `
            --platform=win_amd64 --commit="$env:GITHUB_SHA" `
            --inputs=server-inputs --output=server-artifact
          exit $LASTEXITCODE
      - name: Upload qualified Windows wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loom-sdk-wheel-windows-${{ inputs.profile }}
          path: wheel-artifact/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - name: Upload qualified standalone Windows server
        if: inputs.profile == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loom-server-archive-windows-${{ inputs.profile }}
          path: server-artifact/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
