name: Loom

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".bazelrc"
      - ".bazelrc.configured"
      - ".github/scripts/**"
      - ".github/workflows/ci_iree*.yml"
      - ".github/workflows/build_loom_sdk.yml"
      - ".github/workflows/build_loom_sdk_artifacts.yml"
      - ".github/workflows/release_loom_sdk.yml"
      - "BUILD.bazel"
      - "BUILDING.md"
      - "CMakeLists.txt"
      - "MODULE.*"
      - "dev.py"
      - "requirements-analysis*"
      - "requirements-dev*"
      - "build_tools/**"
      - "runtime/**"
      - "loom/**"
      - "libamdf/**"
      - "third_party/**"
      - "tools/**"
  push:
    branches:
      - main
      - main-staging
    paths:
      - ".bazelrc"
      - ".bazelrc.configured"
      - ".github/scripts/**"
      - ".github/workflows/ci_iree*.yml"
      - ".github/workflows/build_loom_sdk.yml"
      - ".github/workflows/build_loom_sdk_artifacts.yml"
      - ".github/workflows/release_loom_sdk.yml"
      - "BUILD.bazel"
      - "BUILDING.md"
      - "CMakeLists.txt"
      - "MODULE.*"
      - "dev.py"
      - "requirements-analysis*"
      - "requirements-dev*"
      - "build_tools/**"
      - "runtime/**"
      - "loom/**"
      - "libamdf/**"
      - "third_party/**"
      - "tools/**"

# Main SDK size history completes independently of pull request coalescing.
concurrency:
  group: iree-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  bazel_linux:
    name: Bazel / Linux x86-64 / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang / Fastbuild
            kind: cpu
            command: iree-bazel-cpu
            runner: az-linux-scale-rocm-default-prod
            host_ar: ar
            host_cc: clang
            host_cxx: clang++
          - name: Clang / ASAN
            kind: cpu
            command: iree-bazel-cpu-asan
            platform_coverage: true
            runner: az-linux-scale-rocm-default-prod
            host_toolchain: rocm
          - name: Clang / ASAN / Shared Tools
            kind: cpu
            command: iree-bazel-cpu-shared-tools-asan
            platform_coverage: true
            runner: az-linux-scale-rocm-default-prod
            host_toolchain: rocm
          - name: Clang / MSAN
            kind: cpu
            command: iree-bazel-cpu-msan
            runner: az-linux-scale-rocm-default-prod
            host_ar: ar
            host_cc: clang
            host_cxx: clang++
            install_compiler_rt: true
          - name: Clang / TSAN
            kind: cpu
            command: iree-bazel-cpu-tsan
            runner: az-linux-scale-rocm-default-prod
            host_ar: ar
            host_cc: clang
            host_cxx: clang++
            install_compiler_rt: true
          - name: Clang / UBSAN
            kind: cpu
            command: iree-bazel-cpu-ubsan
            runner: az-linux-scale-rocm-default-prod
            host_ar: ar
            host_cc: clang
            host_cxx: clang++
            install_compiler_rt: true
          - name: GCC 15 / Opt / Repository Build
            kind: cpu
            command: iree-bazel-repository-build
            compilation_mode: opt
            gcc_toolset: 15
            platform_coverage: true
            runner: az-linux-scale-rocm-default-prod
            host_ar: ar
            host_cc: gcc
            host_cxx: g++
          - name: GCC / Fastbuild / AMD gfx120x Vulkan
            kind: vulkan
            command: iree-bazel-vulkan
            runner: linux-gfx120X-gpu-rocm
            host_ar: ar
            host_cc: gcc
            host_cxx: g++
            container_options: >-
              --device /dev/dri --cap-add SYS_ADMIN --cap-add SYSLOG
              --security-opt seccomp=unconfined
              --security-opt apparmor=unconfined
              --security-opt systempaths=unconfined --user 0:0
          - name: Clang / Fastbuild / AMD gfx942
            kind: amdgpu
            command: iree-bazel-amdgpu
            runner: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            target_selector: gfx942
            loom_importer: cxx
            container_options: &amdgpu_container_options >-
              --ipc host --group-add video --device /dev/kfd --device /dev/dri --cap-add SYSLOG
              --group-add 993 --group-add 992 --group-add 110
              --ulimit memlock=-1:-1 --security-opt seccomp=unconfined
              --env-file /etc/podinfo/gha-gpu-isolation-settings --user 0:0
          - name: Clang / Fastbuild / AMD gfx90a
            kind: amdgpu
            command: iree-bazel-amdgpu
            runner: linux-gfx90a-1gpu-ossci-rocm
            target_selector: gfx90a
            container_options: *amdgpu_container_options
          - name: Clang / Fastbuild / AMD gfx110x
            kind: amdgpu
            command: iree-bazel-amdgpu
            runner: linux-gfx110X-gpu-rocm
            target_selector: gfx110X-all
            container_options: *amdgpu_container_options
          - name: Clang / Fastbuild / AMD gfx1150
            kind: amdgpu
            command: iree-bazel-amdgpu
            runner: linux-gfx1150-gpu-rocm
            target_selector: gfx1150
            optional: true
            container_options: *amdgpu_container_options
          - name: Clang / Fastbuild / AMD gfx120x
            kind: amdgpu
            command: iree-bazel-amdgpu
            runner: linux-gfx120X-gpu-rocm
            target_selector: gfx120X-all
            container_options: *amdgpu_container_options
          - name: Clang / ASAN / AMD gfx942
            kind: amdgpu
            command: iree-bazel-amdgpu-asan
            runner: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            target_selector: gfx942
            container_options: *amdgpu_container_options
          - name: Clang / TSAN / AMD gfx942
            kind: amdgpu
            command: iree-bazel-amdgpu-tsan
            runner: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            target_selector: gfx942
            container_options: *amdgpu_container_options
          - name: Clang / UBSAN / AMD gfx942
            kind: amdgpu
            command: iree-bazel-amdgpu-ubsan
            runner: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            target_selector: gfx942
            container_options: *amdgpu_container_options
    concurrency:
      group: iree-bazel-linux-${{ matrix.command }}-${{ matrix.target_selector }}-${{ (github.event_name == 'push' && github.ref) || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional || false }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    container:
      image: ${{ matrix.command == 'iree-bazel-repository-build' && 'ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421' || 'ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98' }}
      options: ${{ matrix.container_options || '' }}
    env:
      IREE_CI_PLATFORM_COVERAGE: ${{ matrix.platform_coverage && '1' || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Adjust git config
        run: |
          mkdir -p "$HOME"
          git config --global --add safe.directory "$PWD"

      - name: Configure build environment
        run: |
          case "${{ matrix.kind }}" in
            amdgpu) output_name=iree-bazel-gpu ;;
            vulkan) output_name=iree-bazel-vulkan ;;
            *) output_name=iree-bazel ;;
          esac
          output_dir="${GITHUB_WORKSPACE}/build/${output_name}"
          {
            echo "HRX_ARTIFACT_SET=core"
            echo "HRX_DOWNLOAD_CACHE_DIR=${output_dir}/downloads"
            echo "HRX_OUTPUT_DIR=${output_dir}"
            echo "HRX_PYTHON=${output_dir}/python/bin/python3"
            echo "HRX_RELEASE_TYPE=nightly"
            echo "HRX_ROCM_ROOT=${output_dir}/rocm-root"
            echo "PIP_CACHE_DIR=${output_dir}/caches/pip"
          } >> "$GITHUB_ENV"
          case "${{ matrix.kind }}/${{ matrix.host_toolchain }}" in
            amdgpu/*|*/rocm)
              {
                echo "AR=${output_dir}/rocm-root/lib/llvm/bin/llvm-ar"
                echo "CC=${output_dir}/rocm-root/lib/llvm/bin/clang"
                echo "CXX=${output_dir}/rocm-root/lib/llvm/bin/clang++"
              } >> "$GITHUB_ENV"
              ;;
            *)
              {
                echo "AR=${{ matrix.host_ar }}"
                echo "CC=${{ matrix.host_cc }}"
                echo "CXX=${{ matrix.host_cxx }}"
              } >> "$GITHUB_ENV"
              ;;
          esac

      - name: Select affected tests
        if: matrix.kind == 'cpu' || matrix.kind == 'vulkan' || matrix.kind == 'amdgpu'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 build_tools/ci/change_scope.py --base "$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install repository GCC toolset
        if: matrix.gcc_toolset
        env:
          GCC_TOOLSET: ${{ matrix.gcc_toolset }}
        run: |
          # Retain the manylinux glibc floor while exercising current GCC diagnostics.
          yum install -y \
            "gcc-toolset-${GCC_TOOLSET}-binutils" \
            "gcc-toolset-${GCC_TOOLSET}-binutils-gold" \
            "gcc-toolset-${GCC_TOOLSET}-gcc" \
            "gcc-toolset-${GCC_TOOLSET}-gcc-c++" \
            "gcc-toolset-${GCC_TOOLSET}-libatomic-devel"
          toolset_root="/opt/rh/gcc-toolset-${GCC_TOOLSET}/root"
          # rules_cc prefers gold when lld is absent. Keep it in the selected
          # toolset so detection cannot fall back to the image's older linker.
          "${toolset_root}/usr/bin/ld.gold" --version
          echo "${toolset_root}/usr/bin" >> "$GITHUB_PATH"
          # Replace the image's older toolset library paths as well as its compiler.
          {
            echo "AR=${toolset_root}/usr/bin/ar"
            echo "CC=${toolset_root}/usr/bin/gcc"
            echo "CXX=${toolset_root}/usr/bin/g++"
            echo "DEVTOOLSET_ROOTPATH=${toolset_root}"
            echo "LIBRARY_PATH=${toolset_root}/usr/lib64:${toolset_root}/usr/lib"
            echo "LD_LIBRARY_PATH=${toolset_root}/usr/lib64:${toolset_root}/usr/lib"
          } >> "$GITHUB_ENV"
          test "$("${toolset_root}/usr/bin/gcc" -dumpversion)" = "$GCC_TOOLSET"
          test "$("${toolset_root}/usr/bin/g++" -dumpversion)" = "$GCC_TOOLSET"

      - name: Install Vulkan build environment
        if: matrix.kind == 'vulkan'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc g++ libvulkan1 mesa-vulkan-drivers vulkan-tools
          dpkg-query -W gcc g++ libvulkan1 mesa-vulkan-drivers vulkan-tools

      - name: Set up Python
        if: matrix.command != 'iree-bazel-repository-build'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        if: matrix.kind == 'cpu' && matrix.command != 'iree-bazel-repository-build'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Clang sanitizer runtimes
        if: matrix.install_compiler_rt
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-rt-18-dev

      - name: Fetch ROCm toolchain
        if: matrix.kind != 'vulkan'
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Check Vulkan hardware environment
        if: matrix.kind == 'vulkan'
        timeout-minutes: 1
        run: bash .github/scripts/check_vulkan_hardware_environment.sh

      - name: Install Bazel host tools
        run: |
          python3 --version
          python3 dev.py bazel setup --venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check Bazel sandbox environment
        if: matrix.kind == 'vulkan'
        run: |
          sandbox="$(bazel info install_base)/linux-sandbox"
          execution_root="$(bazel info execution_root)"
          mkdir -p "$execution_root"
          namei -l "$execution_root"
          "$sandbox" -W "$execution_root" -- /bin/true

      - name: Check tool versions
        if: matrix.kind == 'cpu' || matrix.kind == 'vulkan' || matrix.kind == 'amdgpu'
        run: |
          bazel --version
          if [[ "${{ matrix.kind }}" == vulkan ]]; then
            "${CC}" --version
            "${CXX}" --version
            "${AR}" --version
          else
            expect_rocm=()
            if [[ "${{ matrix.kind }}" == amdgpu || "${{ matrix.host_toolchain }}" == rocm ]]; then
              expect_rocm=(--expect-rocm)
            fi
            bash .github/scripts/check_host_toolchain.sh "${expect_rocm[@]}"
            bash .github/scripts/check_rocm_device_toolchain.sh
            test -d "${HRX_ROCM_ROOT}/include"
          fi

      - name: Report ROCm environment
        if: matrix.kind == 'amdgpu'
        timeout-minutes: 1
        run: >-
          bash .github/scripts/check_rocm_environment.sh
          --export-libamdf-gpu-selection
          --amdgpu-target "${{ matrix.target_selector }}"

      - name: Run IREE Bazel CI
        if: matrix.kind == 'cpu' || matrix.kind == 'vulkan' || matrix.kind == 'amdgpu'
        id: iree_bazel_ci
        shell: bash
        env:
          IREE_CI_COMMAND: ${{ matrix.command }}
          IREE_CI_COMPILATION_MODE: ${{ matrix.compilation_mode }}
          IREE_CI_KIND: ${{ matrix.kind }}
          IREE_CI_LOOM_IMPORTER: ${{ matrix.loom_importer }}
          IREE_CI_LOOM_ONLY: ${{ steps.scope.outputs.loom_only }}
          IREE_CI_TARGET_SELECTOR: ${{ matrix.target_selector }}
        run: |
          scope_args=()
          if [[ "$IREE_CI_LOOM_ONLY" == true ]]; then
            case "$IREE_CI_COMMAND" in
              iree-bazel-repository-build|iree-bazel-cpu-shared-tools-asan) ;;
              *) scope_args=(--target //loom/...) ;;
            esac
          fi
          compilation_args=()
          if [[ -n "$IREE_CI_COMPILATION_MODE" ]]; then
            compilation_args=(--compilation-mode "$IREE_CI_COMPILATION_MODE")
          fi
          target_args=()
          if [[ -n "$IREE_CI_TARGET_SELECTOR" ]]; then
            target_args=(--amdgpu-target "$IREE_CI_TARGET_SELECTOR")
          fi
          importer_args=()
          if [[ -n "$IREE_CI_LOOM_IMPORTER" ]]; then
            importer_args=(--loom-importer "$IREE_CI_LOOM_IMPORTER")
          fi
          result_args=()
          if [[ "$IREE_CI_KIND" == amdgpu ]]; then
            result_args=(--bazel-test-results-dir "${RUNNER_TEMP}/native-test-results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          elif [[ "$IREE_CI_COMMAND" != iree-bazel-repository-build ]]; then
            result_args=(--bazel-test-results-dir "${RUNNER_TEMP}/repository-test-results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          fi
          failure_args=()
          if [[ "$IREE_CI_KIND" == cpu ]]; then
            failure_args=(--keep-going)
          fi
          python3 build_tools/devtools/ci.py "$IREE_CI_COMMAND" \
            "${target_args[@]}" "${importer_args[@]}" "${scope_args[@]}" "${result_args[@]}" "${compilation_args[@]}" \
            --bazel-profile-dir "${RUNNER_TEMP}/bazel-profiles" "${failure_args[@]}"

      - name: Capture accelerator kernel errors
        if: ${{ always() && matrix.kind != 'cpu' && (steps.iree_bazel_ci.outcome == 'failure' || steps.iree_bazel_ci.outcome == 'cancelled') }}
        run: |
          date -u
          uname -a
          timeout --kill-after=5s 15s dmesg --ctime --level=err,warn 2>&1 | tail -n 200

      - name: Upload Bazel profiles
        continue-on-error: true
        if: ${{ always() && steps.iree_bazel_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-profiles-${{ matrix.command }}-${{ matrix.target_selector || 'host' }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-profiles/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload failed test results
        if: ${{ always() && steps.iree_bazel_ci.outcome == 'failure' && matrix.kind != 'amdgpu' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.command }}-${{ matrix.target_selector || 'host' }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-test-results-${{ github.run_id }}-${{ github.run_attempt }}/**/bazel-testlogs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload native test results
        if: ${{ always() && matrix.kind == 'amdgpu' && steps.iree_bazel_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-test-results-${{ matrix.command }}-${{ matrix.target_selector || 'amdgpu' }}-linux-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-test-results-${{ github.run_id }}-${{ github.run_attempt }}/**/bazel-testlogs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve Vulkan reproducers on failure
        if: ${{ always() && matrix.kind == 'vulkan' && steps.iree_bazel_ci.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulkan-bazel-executables-attempt-${{ github.run_attempt }}
          # The runfiles retain the actual exec-configured Loom runner.
          path: |
            bazel-bin/loom/target/spirv/test/corpus/numeric_vector_packed_selection_test_execute_spirv_vulkan_hardware_test
            bazel-bin/loom/target/spirv/test/corpus/numeric_vector_packed_selection_test_execute_spirv_vulkan_hardware_test.runfiles/
            bazel-bin/runtime/src/iree/hal/driver/vulkan/cts/slab_pool_tests
          if-no-files-found: warn
          retention-days: 7

  sdk:
    name: SDK
    uses: $/.github/workflows/build_loom_sdk.yml
    with:
      profile: Release

  docs_deploy:
    name: Documentation / GitHub
    if: github.ref == 'refs/heads/main' && needs.sdk.outputs.documentation == 'true'
    needs: sdk
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  bazel_windows:
    name: Bazel / Windows x86-64 / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang CL / Fastbuild
            kind: repository
            command: iree-bazel-repository-integration
            host_toolchain: clang-cl
            platform_coverage: true
            runner: azure-windows-scale-rocm
          - name: MSVC / Fastbuild / Repository Build
            kind: repository
            command: iree-bazel-repository-build
            host_toolchain: msvc
            runner: azure-windows-scale-rocm
          - name: Clang CL / Fastbuild / Repository Build
            kind: repository
            command: iree-bazel-repository-build
            host_toolchain: clang-cl
            platform_coverage: true
            runner: azure-windows-scale-rocm
            target_selector: gfx11-generic
          - name: Clang CL / Fastbuild / Shared Tools
            kind: repository
            command: iree-bazel-repository-shared-tools
            host_toolchain: clang-cl
            platform_coverage: true
            runner: azure-windows-scale-rocm
          - name: Clang CL / Fastbuild / AMD gfx1151 NPU5
            kind: amd_client
            command: iree-bazel-amd-client
            host_toolchain: clang-cl
            runner: windows-gfx1151-gpu-rocm
            xdna: true
          - name: Clang CL / ASAN / AMD gfx120x
            kind: amdgpu
            command: iree-bazel-amdgpu-native-asan
            host_toolchain: clang-cl
            runner: windows-gfx1201-gpu-rocm
            target_selector: gfx120X-all
    concurrency:
      group: iree-bazel-windows-${{ matrix.command }}-${{ matrix.host_toolchain }}-${{ matrix.target_selector }}-${{ (github.event_name == 'push' && github.ref) || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.kind == 'amd_client' && 45 || 60 }}
    env:
      BAZEL_LLVM: ${{ github.workspace }}\build\${{ matrix.kind == 'amd_client' && 'iree-bazel-client' || 'iree-bazel-windows' }}\rocm-root\lib\llvm
      IREE_CI_BAZEL_REMOTE_CACHE: ${{ matrix.remote_cache && '1' || '0' }}
      # Trusted HRX branches populate the shared cache before merge; fork pull
      # requests remain read-only at the repository ownership boundary.
      IREE_CI_BAZEL_REMOTE_UPLOAD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      IREE_CI_PLATFORM_COVERAGE: ${{ matrix.platform_coverage && '1' || '0' }}
      HRX_ARTIFACT_SET: core
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}\build\${{ matrix.kind == 'amd_client' && 'iree-bazel-client' || 'iree-bazel-windows' }}\downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}\build\${{ matrix.kind == 'amd_client' && 'iree-bazel-client' || 'iree-bazel-windows' }}
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}\build\${{ matrix.kind == 'amd_client' && 'iree-bazel-client' || 'iree-bazel-windows' }}\rocm-root
      IREE_CI_PYTHON: python
      IREE_CI_FAILURE_ARTIFACT_DIR: ${{ github.workspace }}\build\windows-build-failures-${{ github.run_id }}-${{ github.run_attempt }}
      PIP_CACHE_DIR: ${{ github.workspace }}\build\${{ matrix.kind == 'amd_client' && 'iree-bazel-client' || 'iree-bazel-windows' }}\caches\pip
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Select Windows build storage
        shell: powershell
        run: |
          $drives = @(
            Get-PSDrive -PSProvider FileSystem -ErrorAction Stop |
              Where-Object { $_.Root -match '^[A-Za-z]:\\$' -and $null -ne $_.Free } |
              Sort-Object Free -Descending
          )
          $drives |
            Select-Object Name, Root, DisplayRoot,
              @{Name = 'FreeGiB'; Expression = {[math]::Round($_.Free / 1GB, 1)}},
              @{Name = 'UsedGiB'; Expression = {[math]::Round($_.Used / 1GB, 1)}} |
            Format-Table -AutoSize
          # B: is the Azure pool's canonical build mapping. Equivalent aliases
          # can expand to longer host paths that exceed MSVC's path handling.
          $preferredDrive = $drives | Where-Object Name -eq 'B' | Select-Object -First 1
          $candidateDrives = @($preferredDrive) + @(
            $drives | Where-Object Name -ne 'B'
          )
          $selectedDrive = $null
          foreach ($drive in $candidateDrives) {
            if (-not $drive) { continue }
            $probe = Join-Path $drive.Root ".hrx-ci-write-probe-$PID"
            try {
              [IO.File]::WriteAllText($probe, '')
              Remove-Item -LiteralPath $probe -Force
              $selectedDrive = $drive
              break
            } catch {
              Remove-Item -LiteralPath $probe -Force -ErrorAction SilentlyContinue
              Write-Warning "Skipping unwritable build volume $($drive.Root): $_"
            }
          }
          if (-not $selectedDrive) { throw 'No writable filesystem volume is available for Windows build outputs.' }
          $outputName = if ("${{ matrix.kind }}" -eq 'amd_client') { 'iree-bazel-client' } else { 'iree-bazel-windows' }
          $buildRoot = Join-Path $selectedDrive.Root 'hrx'
          $outputDir = Join-Path $buildRoot $outputName
          # Keep compiler paths short and stable across runners. The toolchain
          # is small enough for the system volume; build outputs and caches are
          # the high-volume state that belong on the dedicated build volume.
          $rocmRoot = Join-Path $env:SystemDrive 'r'
          $environment = [ordered]@{
            BAZEL_LLVM = Join-Path $rocmRoot 'lib\llvm'
            HRX_DOWNLOAD_CACHE_DIR = Join-Path $outputDir 'downloads'
            HRX_OUTPUT_DIR = $outputDir
            HRX_ROCM_ROOT = $rocmRoot
            IREE_CI_BAZEL_EXECROOT_BACKING = Join-Path $outputDir 'bazel-execroot'
            IREE_CI_BAZEL_OUTPUT_BASE = (Join-Path $env:SystemDrive 'o').Replace('\', '/')
            IREE_CI_BAZEL_REPOSITORY_CACHE = (Join-Path $outputDir 'caches\bazel-repository').Replace('\', '/')
            IREE_CI_FAILURE_ARTIFACT_DIR = Join-Path $outputDir 'failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}'
            PIP_CACHE_DIR = Join-Path $outputDir 'caches\pip'
          }
          New-Item -ItemType Directory -Path $buildRoot -Force | Out-Null
          foreach ($entry in $environment.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          Write-Output "Selected Windows build root $buildRoot with $([math]::Round($selectedDrive.Free / 1GB, 1)) GiB free."
          Write-Output "Using stable toolchain root $rocmRoot and Bazel output base $($environment.IREE_CI_BAZEL_OUTPUT_BASE)."

      - name: Set up Node.js
        if: matrix.kind == 'repository' && matrix.command != 'iree-bazel-repository-build'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check Windows host capabilities
        shell: powershell
        run: |
          $computerSystem = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
          $computerSystem |
            Format-List Manufacturer, Model, NumberOfProcessors, NumberOfLogicalProcessors, TotalPhysicalMemory
          Get-CimInstance Win32_Processor -ErrorAction Stop |
            Format-Table Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed -AutoSize
          $bazelJobs = [Math]::Min(40, [int]$computerSystem.NumberOfLogicalProcessors)
          if ($bazelJobs -lt 1) { throw 'Windows host did not report any logical processors.' }
          "IREE_CI_BAZEL_JOBS=$bazelJobs" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Windows Bazel jobs=$bazelJobs"
          $fileSystemPolicy = Get-Item -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -ErrorAction Stop
          Write-Output "LongPathsEnabled=$($fileSystemPolicy.GetValue('LongPathsEnabled', '<unset>'))"
          python build_tools/bazel/configure.py --check-windows-host

      - name: Fetch ROCm toolchain
        shell: powershell
        run: |
          python -m pip install --upgrade boto3 zstandard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build_tools/ci/ci_core_windows.py fetch-rocm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install developer tools
        shell: powershell
        run: |
          # Bazel resolves B: through the Azure volume's per-VM C:\<GUID>
          # mount, which makes action and runfiles paths too long for MSVC.
          # Keep the logical execroot short while storing its contents on the
          # high-capacity build volume. Test launchers resolve declared source
          # runfiles through Bazel instead of depending on this physical tree.
          $outputBase = $env:IREE_CI_BAZEL_OUTPUT_BASE.Replace('/', '\')
          $execroot = Join-Path $outputBase 'execroot'
          $backing = $env:IREE_CI_BAZEL_EXECROOT_BACKING
          New-Item -ItemType Directory -Path $outputBase -Force | Out-Null
          if ([IO.Path]::GetPathRoot($outputBase) -ne [IO.Path]::GetPathRoot($backing)) {
            New-Item -ItemType Directory -Path $backing -Force | Out-Null
            if (Test-Path -LiteralPath $execroot) {
              $item = Get-Item -LiteralPath $execroot -Force
              $actualTarget = @($item.Target) | Select-Object -First 1
              if ($item.LinkType -ne 'Junction' -or
                  [IO.Path]::GetFullPath($actualTarget) -ne [IO.Path]::GetFullPath($backing)) {
                throw "Bazel execroot $execroot is not the expected junction to $backing."
              }
            } else {
              New-Item -ItemType Junction -Path $execroot -Target $backing | Out-Null
            }
            Write-Output "Using short Bazel execroot $execroot backed by $backing."
          }
          "startup --output_base=$env:IREE_CI_BAZEL_OUTPUT_BASE" |
            Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          "common --repository_cache=$env:IREE_CI_BAZEL_REPOSITORY_CACHE" |
            Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          # Large Windows hosts exhaust process-creation resources before
          # scaling to every logical processor. Smaller hardware hosts retain
          # their native processor count.
          "build --jobs=$env:IREE_CI_BAZEL_JOBS" |
            Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          if ($env:IREE_CI_BAZEL_REMOTE_CACHE -eq '1') {
            $cacheStatus = Invoke-RestMethod `
              -Uri 'http://bazelremote-svc.bazelremote-ns.svc.cluster.local:8080/status' `
              -Method Get -TimeoutSec 10
            Write-Output "ROCm CI Bazel cache: $($cacheStatus | ConvertTo-Json -Compress)"
            "build --config=rocm-ci-cache" |
              Out-File -FilePath .bazelrc.local -Encoding ascii -Append
            if ($env:IREE_CI_BAZEL_REMOTE_UPLOAD -ne 'true') {
              "build --remote_upload_local_results=false" |
                Out-File -FilePath .bazelrc.local -Encoding ascii -Append
            }
          }
          if ("${{ matrix.kind }}" -eq "repository") {
            if ("${{ matrix.host_toolchain }}" -eq "clang-cl") {
              # The platform lane's Python and shell tests materialize large
              # runfiles trees. Limit their concurrent filesystem work while
              # preserving the full build-action pool.
              "test --local_test_jobs=20" |
                Out-File -FilePath .bazelrc.local -Encoding ascii -Append
            } elseif ("${{ matrix.host_toolchain }}" -eq "msvc") {
              # MSVC repository tests need process-launch headroom; bound test
              # actions independently while builds retain the full pool.
              "test --local_test_jobs=35" |
                Out-File -FilePath .bazelrc.local -Encoding ascii -Append
            }
          }
          if ("${{ matrix.host_toolchain }}" -eq "msvc") {
            "build --config=windows-msvc" |
              Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          }
          python --version
          python dev.py bazel setup --venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check native GPU and accelerator access
        if: matrix.kind == 'amd_client' || matrix.kind == 'amdgpu'
        shell: powershell
        run: |
          Get-CimInstance Win32_OperatingSystem -ErrorAction Stop |
            Format-List Caption, Version, BuildNumber
          $accelerators = @()
          if ("${{ matrix.xdna }}" -eq 'true') {
            $accelerators = @(Get-PnpDevice -Class ComputeAccelerator -PresentOnly -ErrorAction Stop)
            if (-not ($accelerators | Where-Object Status -eq 'OK')) {
              throw 'This runner requires a healthy native compute accelerator.'
            }
          }
          $gpus = @(Get-PnpDevice -Class Display -PresentOnly -ErrorAction Stop |
            Where-Object InstanceId -Like 'PCI\VEN_1002&*')
          $devices = $accelerators + $gpus
          $devices | Format-Table Status, Class, FriendlyName, InstanceId -AutoSize
          foreach ($device in $devices) {
            Write-Output $device.InstanceId
            Get-PnpDeviceProperty -InstanceId $device.InstanceId -ErrorAction Stop -KeyName `
              DEVPKEY_Device_DriverVersion, DEVPKEY_Device_DriverDate, DEVPKEY_Device_DriverInfPath |
              Format-Table KeyName, Data -AutoSize
          }
          if (-not ($gpus | Where-Object Status -eq 'OK')) {
            throw 'This runner requires a healthy AMD GPU.'
          }
          if ("${{ matrix.kind }}" -eq 'amd_client') {
            (Get-Item (Join-Path $env:SystemRoot 'System32\vulkan-1.dll') -ErrorAction Stop).VersionInfo |
              Format-List FileName, FileVersion, ProductVersion
          }

      - name: Run IREE Bazel CI
        if: matrix.kind == 'repository'
        id: iree_bazel_ci
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual Studio C++ tools discovery failed.' }
          Import-Module (Join-Path $installation 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'Visual Studio x64 developer environment was not initialized.' }
          if ("${{ matrix.host_toolchain }}" -eq 'msvc') {
            $env:CC = 'cl.exe'
            $env:CXX = 'cl.exe'
            $env:AR = 'lib.exe'
          } else {
            foreach ($tool in @('clang-cl.exe', 'lld-link.exe', 'llvm-lib.exe')) {
              if (-not (Test-Path -LiteralPath (Join-Path $env:BAZEL_LLVM "bin\$tool") -PathType Leaf)) {
                throw "Missing LLVM tool: $tool"
              }
            }
            $env:CC = Join-Path $env:BAZEL_LLVM 'bin\clang-cl.exe'
            $env:CXX = $env:CC
            $env:AR = Join-Path $env:BAZEL_LLVM 'bin\llvm-lib.exe'
          }
          $resultArgs = @()
          if ('${{ matrix.command }}' -ne 'iree-bazel-repository-build') {
            $repositoryResultsDir = Join-Path $env:RUNNER_TEMP "repository-test-results-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $resultArgs += @('--bazel-test-results-dir', $repositoryResultsDir)
          }
          $targetArgs = @()
          if ("${{ matrix.target_selector }}") {
            $targetArgs += @('--amdgpu-target', '${{ matrix.target_selector }}')
          }
          python build_tools/devtools/ci.py '${{ matrix.command }}' @targetArgs @resultArgs `
            --bazel-profile-dir "$env:RUNNER_TEMP\bazel-profiles" --keep-going
          exit $LASTEXITCODE

      - name: Build and test native AMD devices
        if: matrix.kind == 'amd_client' || matrix.kind == 'amdgpu'
        id: client_ci
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) { throw 'Visual Studio C++ tools discovery failed.' }
          $installation = $visualStudio.installationPath
          Import-Module (Join-Path $installation 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'Visual Studio x64 developer environment was not initialized.' }
          $env:BAZEL_VC = $env:VCINSTALLDIR.TrimEnd('\')
          $env:BAZEL_VC_FULL_VERSION = $env:VCToolsVersion
          if ('${{ matrix.command }}'.EndsWith('-asan')) {
            $catalog = Join-Path $env:ProgramData "Microsoft\VisualStudio\Packages\_Instances\$($visualStudio.instanceId)\catalog.json"
            $stlAsanDirectory = python build_tools/ci/windows_stl_asan.py `
              --tools-dir ($env:VCToolsInstallDir.TrimEnd('\')) --catalog $catalog `
              --output-dir "$env:HRX_OUTPUT_DIR\stl-asan"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # rules_cc reconstructs LIB from vcvarsall, so supply the companion
            # as an explicit ASAN link search path instead of editing LIB.
            "build:asan --linkopt=`"/LIBPATH:$($stlAsanDirectory.Replace('\', '/'))`"" |
              Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          }
          foreach ($tool in @('clang-cl.exe', 'lld-link.exe', 'llvm-lib.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:BAZEL_LLVM "bin\$tool") -PathType Leaf)) {
              throw "Missing LLVM tool: $tool"
            }
          }
          $env:CC = Join-Path $env:BAZEL_LLVM 'bin\clang-cl.exe'
          $env:CXX = $env:CC
          $env:AR = Join-Path $env:BAZEL_LLVM 'bin\llvm-lib.exe'
          $nativeResultsDir = Join-Path $env:RUNNER_TEMP "native-test-results-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $targetArgs = @()
          if ("${{ matrix.target_selector }}") {
            $targetArgs += @('--amdgpu-target', '${{ matrix.target_selector }}')
          }
          python build_tools/devtools/ci.py '${{ matrix.command }}' @targetArgs `
            --bazel-profile-dir "$env:RUNNER_TEMP\bazel-profiles" `
            --bazel-test-results-dir $nativeResultsDir
          exit $LASTEXITCODE

      - name: Report Windows build storage
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          Get-PSDrive -PSProvider FileSystem -ErrorAction Stop |
            Where-Object { $_.Root -match '^[A-Za-z]:\\$' -and $null -ne $_.Free } |
            Select-Object Name, Root, DisplayRoot,
              @{Name = 'FreeGiB'; Expression = {[math]::Round($_.Free / 1GB, 1)}},
              @{Name = 'UsedGiB'; Expression = {[math]::Round($_.Used / 1GB, 1)}} |
            Format-Table -AutoSize

      - name: Upload Windows build failure evidence
        if: ${{ always() && (steps.iree_bazel_ci.outcome == 'failure' || steps.client_ci.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-failures-${{ matrix.command }}-${{ matrix.host_toolchain }}-attempt-${{ github.run_attempt }}
          path: ${{ env.IREE_CI_FAILURE_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Bazel profiles
        continue-on-error: true
        if: ${{ always() && (steps.iree_bazel_ci.outcome != 'skipped' || steps.client_ci.outcome != 'skipped') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-profiles-windows-${{ matrix.command }}-${{ matrix.host_toolchain }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}\bazel-profiles\
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload failed test results
        if: ${{ always() && steps.iree_bazel_ci.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.command }}-${{ matrix.host_toolchain }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-test-results-${{ github.run_id }}-${{ github.run_attempt }}/**/bazel-testlogs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload native test results
        continue-on-error: true
        if: ${{ always() && steps.client_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-test-results-${{ matrix.kind }}-windows-${{ matrix.target_selector }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-test-results-${{ github.run_id }}-${{ github.run_attempt }}/**/bazel-testlogs/**
          if-no-files-found: warn
          retention-days: 7

  cmake_linux:
    name: CMake / Linux x86-64 / Clang / RelWithDebInfo / Repository Build
    concurrency:
      group: iree-cmake-linux-repository-build-${{ (github.event_name == 'push' && github.ref) || github.run_id }}
      cancel-in-progress: true
    runs-on: az-linux-scale-rocm-default-prod
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Adjust git config
        run: |
          mkdir -p "$HOME"
          git config --global --add safe.directory "$PWD"

      - name: Configure build environment
        run: |
          output_dir="${GITHUB_WORKSPACE}/build/iree-cmake"
          {
            echo "AR=${output_dir}/rocm-root/lib/llvm/bin/llvm-ar"
            echo "CC=${output_dir}/rocm-root/lib/llvm/bin/clang"
            echo "CXX=${output_dir}/rocm-root/lib/llvm/bin/clang++"
            echo "HRX_ARTIFACT_SET=core"
            echo "HRX_DOWNLOAD_CACHE_DIR=${output_dir}/downloads"
            echo "HRX_OUTPUT_DIR=${output_dir}"
            echo "HRX_PYTHON=${output_dir}/python/bin/python3"
            echo "HRX_RELEASE_TYPE=nightly"
            echo "HRX_ROCM_ROOT=${output_dir}/rocm-root"
            echo "PIP_CACHE_DIR=${output_dir}/caches/pip"
          } >> "$GITHUB_ENV"

      - name: Fetch ROCm toolchain
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Install CMake host tools
        run: |
          python3 --version
          python3 dev.py cmake setup --venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check tool versions
        run: |
          cmake --version
          ctest --version
          ninja --version
          bash .github/scripts/check_host_toolchain.sh --expect-rocm
          bash .github/scripts/check_rocm_device_toolchain.sh
          test -d "${HRX_ROCM_ROOT}/include"

      - name: Run IREE CMake CI
        id: iree_cmake_ci
        run: >-
          python3 build_tools/devtools/ci.py
          iree-cmake-repository-build --keep-going

      - name: Upload failed test results
        if: ${{ always() && steps.iree_cmake_ci.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-results-linux-iree-cmake-repository-build-attempt-${{ github.run_attempt }}
          path: |
            build/ci/**/Testing/Temporary/
            build/ci/**/test_tmpdir/**/test.xml
          if-no-files-found: warn
          retention-days: 7

  cmake_windows:
    name: CMake / Windows x86-64 / MSVC / RelWithDebInfo / Repository Build
    concurrency:
      group: iree-cmake-windows-repository-build-${{ (github.event_name == 'push' && github.ref) || github.run_id }}
      cancel-in-progress: true
    runs-on: azure-windows-scale-rocm
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 40
      HRX_ARTIFACT_SET: core
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}\build\iree-cmake-windows\downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}\build\iree-cmake-windows
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}\build\iree-cmake-windows\rocm-root
      IREE_CI_PYTHON: python
      IREE_CI_FAILURE_ARTIFACT_DIR: ${{ github.workspace }}\build\windows-build-failures-${{ github.run_id }}-${{ github.run_attempt }}
      PIP_CACHE_DIR: ${{ github.workspace }}\build\iree-cmake-windows\caches\pip
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install developer tools
        shell: powershell
        run: |
          python --version
          python dev.py cmake setup --venv
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run IREE CMake CI
        id: iree_cmake_ci
        shell: powershell
        run: |
          Get-CimInstance Win32_ComputerSystem -ErrorAction Stop |
            Format-List Manufacturer, Model, NumberOfProcessors, NumberOfLogicalProcessors, TotalPhysicalMemory
          Get-CimInstance Win32_Processor -ErrorAction Stop |
            Format-Table Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed -AutoSize
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual Studio C++ tools discovery failed.' }
          Import-Module (Join-Path $installation 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'Visual Studio x64 developer environment was not initialized.' }
          $env:CC = 'cl.exe'
          $env:CXX = 'cl.exe'
          $env:AR = 'lib.exe'
          python build_tools/devtools/ci.py iree-cmake-repository-build --keep-going
          exit $LASTEXITCODE

      - name: Upload Windows build failure evidence
        if: ${{ always() && steps.iree_cmake_ci.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-failures-iree-cmake-repository-build-attempt-${{ github.run_attempt }}
          path: ${{ env.IREE_CI_FAILURE_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failed test results
        if: ${{ always() && steps.iree_cmake_ci.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-results-windows-iree-cmake-repository-build-attempt-${{ github.run_attempt }}
          path: |
            build/ci/**/Testing/Temporary/
            build/ci/**/test_tmpdir/**/test.xml
          if-no-files-found: warn
          retention-days: 7
