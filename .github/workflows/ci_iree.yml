name: Loom

on:
  workflow_dispatch:
    inputs:
      windows_cache_probe:
        description: Run one bounded Windows remote-cache probe instead of normal jobs
        required: false
        type: choice
        options:
          - none
          - integrity
          - handoff
        default: none
  pull_request:
    paths:
      - ".bazelrc"
      - ".bazelrc.configured"
      - ".github/scripts/**"
      - ".github/workflows/ci_iree*.yml"
      - ".github/workflows/build_loom_sdk.yml"
      - ".github/workflows/build_loom_sdk_artifacts.yml"
      - ".github/workflows/release_loom_sdk.yml"
      - "BUILD.bazel"
      - "BUILDING.md"
      - "CMakeLists.txt"
      - "MODULE.*"
      - "dev.py"
      - "requirements-analysis*"
      - "requirements-dev*"
      - "build_tools/**"
      - "runtime/**"
      - "loom/**"
      - "libamdf/**"
      - "third_party/**"
      - "tools/**"
  push:
    branches:
      - main
      - main-staging
    paths:
      - ".bazelrc"
      - ".bazelrc.configured"
      - ".github/scripts/**"
      - ".github/workflows/ci_iree*.yml"
      - ".github/workflows/build_loom_sdk.yml"
      - ".github/workflows/build_loom_sdk_artifacts.yml"
      - ".github/workflows/release_loom_sdk.yml"
      - "BUILD.bazel"
      - "BUILDING.md"
      - "CMakeLists.txt"
      - "MODULE.*"
      - "dev.py"
      - "requirements-analysis*"
      - "requirements-dev*"
      - "build_tools/**"
      - "runtime/**"
      - "loom/**"
      - "libamdf/**"
      - "third_party/**"
      - "tools/**"

# Main SDK size history completes independently of pull request coalescing.
concurrency:
  group: iree-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  bazel_linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_cache_probe == 'none' }}
    name: Bazel / ${{ matrix.platform || 'Linux x86-64' }} / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang / Fastbuild
            kind: cpu
            command: iree-bazel-cpu
            runner: az-linux-scale-rocm-default-prod
            host_ar: ar
            host_cc: clang
            host_cxx: clang++
          - name: Clang / ASAN
            kind: cpu
            command: iree-bazel-cpu-asan
            platform_coverage: true
            runner: az-linux-scale-rocm-default-prod
            artifact_set: llvm
            host_toolchain: artifact
          - name: Clang / ASAN / Shared Tools
            kind: cpu
            command: iree-bazel-cpu-shared-tools-asan
            platform_coverage: true
            runner: az-linux-scale-rocm-default-prod
            artifact_set: llvm
            host_toolchain: artifact
          - name: Clang / MSAN
            kind: cpu
            command: iree-bazel-cpu-msan
            runner: az-linux-scale-rocm-default-prod
            host_ar: ar
            host_cc: clang
            host_cxx: clang++
            install_compiler_rt: true
          - name: Clang / TSAN
            kind: cpu
            command: iree-bazel-cpu-tsan
            runner: az-linux-scale-rocm-default-prod
            host_ar: ar
            host_cc: clang
            host_cxx: clang++
            install_compiler_rt: true
          - name: Clang / UBSAN
            kind: cpu
            command: iree-bazel-cpu-ubsan
            runner: az-linux-scale-rocm-default-prod
            host_ar: ar
            host_cc: clang
            host_cxx: clang++
            install_compiler_rt: true
          - name: GCC 15 / Opt / Repository Build
            kind: cpu
            command: iree-bazel-repository-build
            compilation_mode: opt
            gcc_toolset: 15
            platform_coverage: true
            runner: az-linux-scale-rocm-default-prod
            artifact_set: core
            host_ar: ar
            host_cc: gcc
            host_cxx: g++
          - name: MSVC / Fastbuild / Repository Build
            kind: windows_msvc
            command: iree-bazel-repository-build
            platform: Windows x86-64 (via Linux)
            runner: az-linux-scale-rocm-default-prod
            artifact_set: core
            host_toolchain: artifact
          - name: GCC / Fastbuild / AMD gfx120x Vulkan
            kind: vulkan
            command: iree-bazel-vulkan
            runner: linux-gfx120X-gpu-rocm
            host_ar: ar
            host_cc: gcc
            host_cxx: g++
            container_options: >-
              --device /dev/dri --cap-add SYS_ADMIN --cap-add SYSLOG
              --security-opt seccomp=unconfined
              --security-opt apparmor=unconfined
              --security-opt systempaths=unconfined --user 0:0
          - name: Clang / Fastbuild / AMD gfx942
            kind: amdgpu
            command: iree-bazel-amdgpu
            runner: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            artifact_set: core
            target_selector: gfx942
            loom_importer: cxx
            container_options: &amdgpu_container_options >-
              --ipc host --group-add video --device /dev/kfd --device /dev/dri --cap-add SYSLOG
              --group-add 993 --group-add 992 --group-add 110
              --ulimit memlock=-1:-1 --security-opt seccomp=unconfined
              --env-file /etc/podinfo/gha-gpu-isolation-settings --user 0:0
          - name: Clang / Fastbuild / AMD gfx90a
            kind: amdgpu
            command: iree-bazel-amdgpu
            runner: linux-gfx90a-1gpu-ossci-rocm
            artifact_set: core
            target_selector: gfx90a
            container_options: *amdgpu_container_options
          - name: Clang / Fastbuild / AMD gfx110x
            kind: amdgpu
            command: iree-bazel-amdgpu
            runner: linux-gfx110X-gpu-rocm
            artifact_set: core
            target_selector: gfx110X-all
            container_options: *amdgpu_container_options
          - name: Clang / Fastbuild / AMD gfx1150
            kind: amdgpu
            command: iree-bazel-amdgpu
            runner: labxsj-linux-u2604-gfx1150-gpu-rocm
            artifact_set: core
            target_selector: gfx1150
            optional: true
            container_options: *amdgpu_container_options
          - name: Clang / Fastbuild / AMD gfx120x
            kind: amdgpu
            command: iree-bazel-amdgpu
            runner: linux-gfx120X-gpu-rocm
            artifact_set: core
            target_selector: gfx120X-all
            container_options: *amdgpu_container_options
          - name: Clang / ASAN / AMD gfx942
            kind: amdgpu
            command: iree-bazel-amdgpu-asan
            runner: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            artifact_set: core
            target_selector: gfx942
            container_options: *amdgpu_container_options
          - name: Clang / TSAN / AMD gfx942
            kind: amdgpu
            command: iree-bazel-amdgpu-tsan
            runner: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            artifact_set: core
            target_selector: gfx942
            container_options: *amdgpu_container_options
          - name: Clang / UBSAN / AMD gfx942
            kind: amdgpu
            command: iree-bazel-amdgpu-ubsan
            runner: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            artifact_set: core
            target_selector: gfx942
            container_options: *amdgpu_container_options
    concurrency:
      group: iree-bazel-linux-${{ matrix.kind }}-${{ matrix.command }}-${{ matrix.target_selector }}-${{ (github.event_name == 'push' && github.ref) || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional || false }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    container:
      image: ${{ matrix.command == 'iree-bazel-repository-build' && matrix.kind != 'windows_msvc' && 'ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421' || 'ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98' }}
      options: ${{ matrix.container_options || '' }}
    env:
      IREE_CI_PLATFORM_COVERAGE: ${{ matrix.platform_coverage && '1' || '0' }}
      IREE_CI_ARTIFACT_SET: ${{ matrix.artifact_set || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Adjust git config
        run: |
          mkdir -p "$HOME"
          git config --global --add safe.directory "$PWD"

      - name: Configure build environment
        run: |
          case "${{ matrix.kind }}" in
            amdgpu) output_name=iree-bazel-gpu ;;
            vulkan) output_name=iree-bazel-vulkan ;;
            *) output_name=iree-bazel ;;
          esac
          output_dir="${GITHUB_WORKSPACE}/build/${output_name}"
          {
            echo "HRX_OUTPUT_DIR=${output_dir}"
            echo "PIP_CACHE_DIR=${output_dir}/caches/pip"
          } >> "$GITHUB_ENV"
          if [[ -n "$IREE_CI_ARTIFACT_SET" ]]; then
            {
              echo "HRX_ARTIFACT_SET=${IREE_CI_ARTIFACT_SET}"
              echo "HRX_DOWNLOAD_CACHE_DIR=${output_dir}/downloads"
              echo "HRX_PYTHON=${output_dir}/python/bin/python3"
              echo "HRX_RELEASE_TYPE=nightly"
              echo "HRX_ROCM_ROOT=${output_dir}/rocm-root"
            } >> "$GITHUB_ENV"
          fi
          if [[ "${{ matrix.kind }}" == windows_msvc ]]; then
            {
              echo "LLVM_ROOT=${output_dir}/rocm-root/lib/llvm"
              echo "WINDOWS_CROSS_ROOT=${output_dir}/windows-toolchain"
              echo "WINDOWS_COMPILER_RT_ROOT=${output_dir}/windows-toolchain/compiler-rt"
              echo "WINSDK_ROOT=${output_dir}/windows-toolchain/sdk"
              echo "MSVC_WINE_ROOT=${output_dir}/msvc-wine"
              echo "WINEARCH=win64"
              echo "WINEPREFIX=${RUNNER_TEMP}/msvc-wine-prefix"
            } >> "$GITHUB_ENV"
          fi
          case "${{ matrix.kind }}/${{ matrix.host_toolchain }}" in
            amdgpu/*|*/artifact)
              {
                echo "AR=${output_dir}/rocm-root/lib/llvm/bin/llvm-ar"
                echo "CC=${output_dir}/rocm-root/lib/llvm/bin/clang"
                echo "CXX=${output_dir}/rocm-root/lib/llvm/bin/clang++"
              } >> "$GITHUB_ENV"
              ;;
            *)
              {
                echo "AR=${{ matrix.host_ar }}"
                echo "CC=${{ matrix.host_cc }}"
                echo "CXX=${{ matrix.host_cxx }}"
              } >> "$GITHUB_ENV"
              ;;
          esac

      - name: Select affected tests
        if: matrix.kind == 'cpu' || matrix.kind == 'vulkan' || matrix.kind == 'amdgpu'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 build_tools/ci/change_scope.py --base "$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install repository GCC toolset
        if: matrix.gcc_toolset
        env:
          GCC_TOOLSET: ${{ matrix.gcc_toolset }}
        run: |
          # Retain the manylinux glibc floor while exercising current GCC diagnostics.
          yum install -y \
            "gcc-toolset-${GCC_TOOLSET}-binutils" \
            "gcc-toolset-${GCC_TOOLSET}-binutils-gold" \
            "gcc-toolset-${GCC_TOOLSET}-gcc" \
            "gcc-toolset-${GCC_TOOLSET}-gcc-c++" \
            "gcc-toolset-${GCC_TOOLSET}-libatomic-devel"
          toolset_root="/opt/rh/gcc-toolset-${GCC_TOOLSET}/root"
          # rules_cc prefers gold when lld is absent. Keep it in the selected
          # toolset so detection cannot fall back to the image's older linker.
          "${toolset_root}/usr/bin/ld.gold" --version
          echo "${toolset_root}/usr/bin" >> "$GITHUB_PATH"
          # Replace the image's older toolset library paths as well as its compiler.
          {
            echo "AR=${toolset_root}/usr/bin/ar"
            echo "CC=${toolset_root}/usr/bin/gcc"
            echo "CXX=${toolset_root}/usr/bin/g++"
            echo "DEVTOOLSET_ROOTPATH=${toolset_root}"
            echo "LIBRARY_PATH=${toolset_root}/usr/lib64:${toolset_root}/usr/lib"
            echo "LD_LIBRARY_PATH=${toolset_root}/usr/lib64:${toolset_root}/usr/lib"
          } >> "$GITHUB_ENV"
          test "$("${toolset_root}/usr/bin/gcc" -dumpversion)" = "$GCC_TOOLSET"
          test "$("${toolset_root}/usr/bin/g++" -dumpversion)" = "$GCC_TOOLSET"

      - name: Install Vulkan build environment
        if: matrix.kind == 'vulkan'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc g++ libvulkan1 mesa-vulkan-drivers vulkan-tools
          dpkg-query -W gcc g++ libvulkan1 mesa-vulkan-drivers vulkan-tools

      - name: Set up Python
        if: matrix.command != 'iree-bazel-repository-build' || matrix.kind == 'windows_msvc'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        if: matrix.kind == 'cpu' && matrix.command != 'iree-bazel-repository-build'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Clang sanitizer runtimes
        if: matrix.install_compiler_rt
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-rt-18-dev

      - name: Fetch TheRock artifacts
        if: env.IREE_CI_ARTIFACT_SET != ''
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Install Wine host tools
        if: matrix.kind == 'windows_msvc'
        run: |
          apt_options=(-o Acquire::ForceIPv4=true -o Acquire::Retries=3)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends \
            p7zip-full wine64

      - name: Restore Windows SDK inputs
        if: matrix.kind == 'windows_msvc'
        id: windows_toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WINDOWS_CROSS_ROOT }}
          key: windows-cross-${{ hashFiles('.github/scripts/setup_windows_cross.sh', '.github/scripts/windows-sdk-channel.json', 'build_tools/ci/windows_stl_asan.py') }}

      - name: Prepare Windows SDK inputs
        if: matrix.kind == 'windows_msvc' && steps.windows_toolchain.outputs.cache-hit != 'true'
        run: bash .github/scripts/setup_windows_cross.sh

      - name: Prepare genuine MSVC tools
        if: matrix.kind == 'windows_msvc'
        run: bash .github/scripts/setup_windows_msvc.sh

      - name: Check Vulkan hardware environment
        if: matrix.kind == 'vulkan'
        timeout-minutes: 1
        run: bash .github/scripts/check_vulkan_hardware_environment.sh

      - name: Install Bazel host tools
        run: |
          python3 --version
          python3 dev.py bazel setup --venv
          if [[ "${{ matrix.kind }}" == windows_msvc ]]; then
            {
              # Keep Wine-visible generated paths below MSVC's path limits.
              echo "startup --output_base=${RUNNER_TEMP}/b"
              echo 'build --config=windows-x86_64'
              echo 'build --config=windows-msvc'
            } >> .bazelrc.local
          fi
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check Bazel sandbox environment
        if: matrix.kind == 'vulkan'
        run: |
          sandbox="$(bazel info install_base)/linux-sandbox"
          execution_root="$(bazel info execution_root)"
          mkdir -p "$execution_root"
          namei -l "$execution_root"
          "$sandbox" -W "$execution_root" -- /bin/true

      - name: Check tool versions
        if: matrix.kind == 'cpu' || matrix.kind == 'vulkan' || matrix.kind == 'amdgpu' || matrix.kind == 'windows_msvc'
        run: |
          bazel --version
          if [[ "${{ matrix.kind }}" == vulkan ]]; then
            "${CC}" --version
            "${CXX}" --version
            "${AR}" --version
          else
            expected_origin=(--expect-system)
            if [[ "${{ matrix.kind }}" == amdgpu || "${{ matrix.host_toolchain }}" == artifact ]]; then
              expected_origin=(--expect-artifact)
            fi
            bash .github/scripts/check_host_toolchain.sh "${expected_origin[@]}"
            if [[ "$IREE_CI_ARTIFACT_SET" == core ]]; then
              bash .github/scripts/check_rocm_device_toolchain.sh
              test -d "${HRX_ROCM_ROOT}/include"
            fi
          fi
          if [[ "${{ matrix.kind }}" == windows_msvc ]]; then
            compiler_dir="$(find "$MSVC_WINE_ROOT/VC/Tools/MSVC" -mindepth 1 -maxdepth 1 -type d -print -quit)/bin/Hostx64/x64"
            wine_executable=/usr/lib/wine/wine64
            test -x "$wine_executable"
            version_source="$RUNNER_TEMP/msvc-version.c"
            version_object="$RUNNER_TEMP/msvc-version.obj"
            printf 'int msvc_version_probe(void) { return 0; }\n' > "$version_source"
            version_source_windows="z:${version_source//\//\\}"
            version_object_windows="z:${version_object//\//\\}"
            WINEDEBUG=-all WINEPATH="${compiler_dir//\//\\}" \
              "$wine_executable" "$compiler_dir/cl.exe" /nologo /Bv /c \
              "$version_source_windows" "/Fo$version_object_windows"
            test -s "$version_object"
          fi

      - name: Report ROCm environment
        if: matrix.kind == 'amdgpu'
        timeout-minutes: 1
        run: >-
          bash .github/scripts/check_rocm_environment.sh
          --export-libamdf-gpu-selection
          --amdgpu-target "${{ matrix.target_selector }}"

      - name: Run IREE Bazel CI
        if: matrix.kind == 'cpu' || matrix.kind == 'vulkan' || matrix.kind == 'amdgpu' || matrix.kind == 'windows_msvc'
        id: iree_bazel_ci
        shell: bash
        env:
          IREE_CI_COMMAND: ${{ matrix.command }}
          IREE_CI_COMPILATION_MODE: ${{ matrix.compilation_mode }}
          IREE_CI_KIND: ${{ matrix.kind }}
          IREE_CI_LOOM_IMPORTER: ${{ matrix.loom_importer }}
          IREE_CI_LOOM_ONLY: ${{ steps.scope.outputs.loom_only }}
          IREE_CI_TARGET_SELECTOR: ${{ matrix.target_selector }}
        run: |
          scope_args=()
          if [[ "$IREE_CI_LOOM_ONLY" == true ]]; then
            case "$IREE_CI_COMMAND" in
              iree-bazel-repository-build|iree-bazel-cpu-shared-tools-asan) ;;
              *) scope_args=(--target //loom/...) ;;
            esac
          fi
          compilation_args=()
          if [[ -n "$IREE_CI_COMPILATION_MODE" ]]; then
            compilation_args=(--compilation-mode "$IREE_CI_COMPILATION_MODE")
          fi
          target_args=()
          if [[ -n "$IREE_CI_TARGET_SELECTOR" ]]; then
            target_args=(--amdgpu-target "$IREE_CI_TARGET_SELECTOR")
          fi
          importer_args=()
          if [[ -n "$IREE_CI_LOOM_IMPORTER" ]]; then
            importer_args=(--loom-importer "$IREE_CI_LOOM_IMPORTER")
          fi
          result_args=()
          if [[ "$IREE_CI_KIND" == amdgpu ]]; then
            result_args=(--bazel-test-results-dir "${RUNNER_TEMP}/native-test-results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          elif [[ "$IREE_CI_COMMAND" != iree-bazel-repository-build ]]; then
            result_args=(--bazel-test-results-dir "${RUNNER_TEMP}/repository-test-results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          fi
          failure_args=()
          if [[ "$IREE_CI_KIND" == cpu || "$IREE_CI_KIND" == windows_msvc ]]; then
            failure_args=(--keep-going)
          fi
          python3 build_tools/devtools/ci.py "$IREE_CI_COMMAND" \
            "${target_args[@]}" "${importer_args[@]}" "${scope_args[@]}" "${result_args[@]}" "${compilation_args[@]}" \
            --bazel-profile-dir "${RUNNER_TEMP}/bazel-profiles" "${failure_args[@]}"

      - name: Capture accelerator kernel errors
        if: ${{ always() && (matrix.kind == 'vulkan' || matrix.kind == 'amdgpu') && (steps.iree_bazel_ci.outcome == 'failure' || steps.iree_bazel_ci.outcome == 'cancelled') }}
        run: |
          date -u
          uname -a
          timeout --kill-after=5s 15s dmesg --ctime --level=err,warn 2>&1 | tail -n 200

      - name: Upload Bazel profiles
        continue-on-error: true
        if: ${{ always() && steps.iree_bazel_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-profiles-${{ matrix.kind }}-${{ matrix.command }}-${{ matrix.target_selector || 'host' }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-profiles/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload failed test results
        if: ${{ always() && steps.iree_bazel_ci.outcome == 'failure' && matrix.kind != 'amdgpu' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.command }}-${{ matrix.target_selector || 'host' }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-test-results-${{ github.run_id }}-${{ github.run_attempt }}/**/bazel-testlogs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload native test results
        if: ${{ always() && matrix.kind == 'amdgpu' && steps.iree_bazel_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-test-results-${{ matrix.command }}-${{ matrix.target_selector || 'amdgpu' }}-linux-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-test-results-${{ github.run_id }}-${{ github.run_attempt }}/**/bazel-testlogs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload native BEP observations
        timeout-minutes: 2
        continue-on-error: true
        if: ${{ always() && matrix.kind == 'amdgpu' && steps.iree_bazel_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-bep-observations-${{ matrix.command }}-${{ matrix.target_selector || 'amdgpu' }}-linux-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-test-results-${{ github.run_id }}-${{ github.run_attempt }}/**/bep-observation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failed native BEP
        timeout-minutes: 2
        continue-on-error: true
        if: ${{ always() && matrix.kind == 'amdgpu' && steps.iree_bazel_ci.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-native-bep-${{ matrix.command }}-${{ matrix.target_selector || 'amdgpu' }}-linux-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-test-results-${{ github.run_id }}-${{ github.run_attempt }}/.events/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Preserve Vulkan reproducers on failure
        if: ${{ always() && matrix.kind == 'vulkan' && steps.iree_bazel_ci.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulkan-bazel-executables-attempt-${{ github.run_attempt }}
          # The runfiles retain the actual exec-configured Loom runner.
          path: |
            bazel-bin/loom/target/spirv/test/corpus/numeric_vector_packed_selection_test_execute_spirv_vulkan_hardware_test
            bazel-bin/loom/target/spirv/test/corpus/numeric_vector_packed_selection_test_execute_spirv_vulkan_hardware_test.runfiles/
            bazel-bin/runtime/src/iree/hal/driver/vulkan/cts/slab_pool_tests
          if-no-files-found: warn
          retention-days: 7

  sdk:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_cache_probe == 'none' }}
    name: SDK
    uses: $/.github/workflows/build_loom_sdk.yml
    with:
      profile: Release

  docs_deploy:
    name: Documentation / GitHub
    if: github.ref == 'refs/heads/main' && needs.sdk.outputs.documentation == 'true'
    needs: sdk
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  bazel_windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_cache_probe == 'none' }}
    name: Bazel / Windows x86-64 / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang CL / Fastbuild
            kind: repository
            command: iree-bazel-repository-integration
            host_toolchain: clang-cl
            platform_coverage: true
            runner: azure-windows-scale-rocm
            target_selector: gfx11-generic
          - name: Clang CL / Fastbuild / Shared Tools
            kind: repository
            command: iree-bazel-repository-shared-tools
            host_toolchain: clang-cl
            platform_coverage: true
            runner: azure-windows-scale-rocm
          - name: Clang CL / Fastbuild / AMD gfx1151 NPU5
            kind: amd_client
            command: iree-bazel-amd-client
            host_toolchain: clang-cl
            runner: windows-gfx1151-gpu-rocm
            xdna: true
          - name: Clang CL / ASAN / AMD gfx120x
            kind: amdgpu
            command: iree-bazel-amdgpu-native-asan
            host_toolchain: clang-cl
            runner: windows-gfx1201-gpu-rocm
            target_selector: gfx120X-all
    concurrency:
      group: iree-bazel-windows-${{ matrix.command }}-${{ matrix.host_toolchain }}-${{ matrix.target_selector }}-${{ (github.event_name == 'push' && github.ref) || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.kind == 'amd_client' && 45 || 60 }}
    env:
      BAZEL_LLVM: ${{ github.workspace }}\build\${{ matrix.kind == 'amd_client' && 'iree-bazel-client' || 'iree-bazel-windows' }}\rocm-root\lib\llvm
      IREE_CI_BAZEL_REMOTE_CACHE: ${{ matrix.remote_cache && '1' || '0' }}
      # Trusted HRX branches populate the shared cache before merge; fork pull
      # requests remain read-only at the repository ownership boundary.
      IREE_CI_BAZEL_REMOTE_UPLOAD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      IREE_CI_PLATFORM_COVERAGE: ${{ matrix.platform_coverage && '1' || '0' }}
      HRX_ARTIFACT_SET: core
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}\build\${{ matrix.kind == 'amd_client' && 'iree-bazel-client' || 'iree-bazel-windows' }}\downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}\build\${{ matrix.kind == 'amd_client' && 'iree-bazel-client' || 'iree-bazel-windows' }}
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}\build\${{ matrix.kind == 'amd_client' && 'iree-bazel-client' || 'iree-bazel-windows' }}\rocm-root
      IREE_CI_PYTHON: python
      IREE_CI_FAILURE_ARTIFACT_DIR: ${{ github.workspace }}\build\windows-build-failures-${{ github.run_id }}-${{ github.run_attempt }}
      PIP_CACHE_DIR: ${{ github.workspace }}\build\${{ matrix.kind == 'amd_client' && 'iree-bazel-client' || 'iree-bazel-windows' }}\caches\pip
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Select Windows build storage
        shell: powershell
        run: |
          $drives = @(
            Get-PSDrive -PSProvider FileSystem -ErrorAction Stop |
              Where-Object { $_.Root -match '^[A-Za-z]:\\$' -and $null -ne $_.Free } |
              Sort-Object Free -Descending
          )
          $drives |
            Select-Object Name, Root, DisplayRoot,
              @{Name = 'FreeGiB'; Expression = {[math]::Round($_.Free / 1GB, 1)}},
              @{Name = 'UsedGiB'; Expression = {[math]::Round($_.Used / 1GB, 1)}} |
            Format-Table -AutoSize
          # B: is the Azure pool's canonical build mapping. Equivalent aliases
          # can expand to longer host paths that exceed MSVC's path handling.
          $preferredDrive = $drives | Where-Object Name -eq 'B' | Select-Object -First 1
          $candidateDrives = @($preferredDrive) + @(
            $drives | Where-Object Name -ne 'B'
          )
          $selectedDrive = $null
          foreach ($drive in $candidateDrives) {
            if (-not $drive) { continue }
            $probe = Join-Path $drive.Root ".hrx-ci-write-probe-$PID"
            try {
              [IO.File]::WriteAllText($probe, '')
              Remove-Item -LiteralPath $probe -Force
              $selectedDrive = $drive
              break
            } catch {
              Remove-Item -LiteralPath $probe -Force -ErrorAction SilentlyContinue
              Write-Warning "Skipping unwritable build volume $($drive.Root): $_"
            }
          }
          if (-not $selectedDrive) { throw 'No writable filesystem volume is available for Windows build outputs.' }
          $outputName = if ("${{ matrix.kind }}" -eq 'amd_client') { 'iree-bazel-client' } else { 'iree-bazel-windows' }
          $buildRoot = Join-Path $selectedDrive.Root 'hrx'
          $outputDir = Join-Path $buildRoot $outputName
          # Keep compiler paths short and stable across runners. The toolchain
          # is small enough for the system volume; build outputs and caches are
          # the high-volume state that belong on the dedicated build volume.
          $rocmRoot = Join-Path $env:SystemDrive 'r'
          $environment = [ordered]@{
            BAZEL_LLVM = Join-Path $rocmRoot 'lib\llvm'
            HRX_DOWNLOAD_CACHE_DIR = Join-Path $outputDir 'downloads'
            HRX_OUTPUT_DIR = $outputDir
            HRX_ROCM_ROOT = $rocmRoot
            IREE_CI_BAZEL_EXECROOT_BACKING = Join-Path $outputDir 'bazel-execroot'
            IREE_CI_BAZEL_OUTPUT_BASE = (Join-Path $env:SystemDrive 'o').Replace('\', '/')
            IREE_CI_BAZEL_REPOSITORY_CACHE = (Join-Path $outputDir 'caches\bazel-repository').Replace('\', '/')
            IREE_CI_FAILURE_ARTIFACT_DIR = Join-Path $outputDir 'failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}'
            PIP_CACHE_DIR = Join-Path $outputDir 'caches\pip'
          }
          New-Item -ItemType Directory -Path $buildRoot -Force | Out-Null
          foreach ($entry in $environment.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          Write-Output "Selected Windows build root $buildRoot with $([math]::Round($selectedDrive.Free / 1GB, 1)) GiB free."
          Write-Output "Using stable toolchain root $rocmRoot and Bazel output base $($environment.IREE_CI_BAZEL_OUTPUT_BASE)."

      - name: Set up Node.js
        if: matrix.kind == 'repository' && matrix.command != 'iree-bazel-repository-build'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check Windows host capabilities
        shell: powershell
        run: |
          $computerSystem = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
          $computerSystem |
            Format-List Manufacturer, Model, NumberOfProcessors, NumberOfLogicalProcessors, TotalPhysicalMemory
          Get-CimInstance Win32_Processor -ErrorAction Stop |
            Format-Table Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed -AutoSize
          $bazelJobs = [Math]::Min(40, [int]$computerSystem.NumberOfLogicalProcessors)
          if ($bazelJobs -lt 1) { throw 'Windows host did not report any logical processors.' }
          "IREE_CI_BAZEL_JOBS=$bazelJobs" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Windows Bazel jobs=$bazelJobs"
          $fileSystemPolicy = Get-Item -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -ErrorAction Stop
          Write-Output "LongPathsEnabled=$($fileSystemPolicy.GetValue('LongPathsEnabled', '<unset>'))"
          python build_tools/bazel/configure.py --check-windows-host

      - name: Fetch ROCm toolchain
        shell: powershell
        run: |
          python -m pip install --upgrade boto3 zstandard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build_tools/ci/ci_core_windows.py fetch-rocm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install developer tools
        shell: powershell
        run: |
          # Bazel resolves B: through the Azure volume's per-VM C:\<GUID>
          # mount, which makes action and runfiles paths too long for MSVC.
          # Keep the logical execroot short while storing its contents on the
          # high-capacity build volume. Test launchers resolve declared source
          # runfiles through Bazel instead of depending on this physical tree.
          $outputBase = $env:IREE_CI_BAZEL_OUTPUT_BASE.Replace('/', '\')
          $execroot = Join-Path $outputBase 'execroot'
          $backing = $env:IREE_CI_BAZEL_EXECROOT_BACKING
          New-Item -ItemType Directory -Path $outputBase -Force | Out-Null
          if ([IO.Path]::GetPathRoot($outputBase) -ne [IO.Path]::GetPathRoot($backing)) {
            New-Item -ItemType Directory -Path $backing -Force | Out-Null
            if (Test-Path -LiteralPath $execroot) {
              $item = Get-Item -LiteralPath $execroot -Force
              $actualTarget = @($item.Target) | Select-Object -First 1
              if ($item.LinkType -ne 'Junction' -or
                  [IO.Path]::GetFullPath($actualTarget) -ne [IO.Path]::GetFullPath($backing)) {
                throw "Bazel execroot $execroot is not the expected junction to $backing."
              }
            } else {
              New-Item -ItemType Junction -Path $execroot -Target $backing | Out-Null
            }
            Write-Output "Using short Bazel execroot $execroot backed by $backing."
          }
          "startup --output_base=$env:IREE_CI_BAZEL_OUTPUT_BASE" |
            Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          "common --repository_cache=$env:IREE_CI_BAZEL_REPOSITORY_CACHE" |
            Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          # Large Windows hosts exhaust process-creation resources before
          # scaling to every logical processor. Smaller hardware hosts retain
          # their native processor count.
          "build --jobs=$env:IREE_CI_BAZEL_JOBS" |
            Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          if ($env:IREE_CI_BAZEL_REMOTE_CACHE -eq '1') {
            $cacheStatus = Invoke-RestMethod `
              -Uri 'http://bazelremote-svc.bazelremote-ns.svc.cluster.local:8080/status' `
              -Method Get -TimeoutSec 10
            Write-Output "ROCm CI Bazel cache: $($cacheStatus | ConvertTo-Json -Compress)"
            "build --config=rocm-ci-cache" |
              Out-File -FilePath .bazelrc.local -Encoding ascii -Append
            if ($env:IREE_CI_BAZEL_REMOTE_UPLOAD -ne 'true') {
              "build --remote_upload_local_results=false" |
                Out-File -FilePath .bazelrc.local -Encoding ascii -Append
            }
          }
          if ("${{ matrix.kind }}" -eq "repository") {
            # The platform lane's Python and shell tests materialize large
            # runfiles trees. Limit their concurrent filesystem work while
            # preserving the full build-action pool.
            "test --local_test_jobs=20" |
              Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          }
          python --version
          python dev.py bazel setup --venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check native GPU and accelerator access
        if: matrix.kind == 'amd_client' || matrix.kind == 'amdgpu'
        shell: powershell
        run: |
          Get-CimInstance Win32_OperatingSystem -ErrorAction Stop |
            Format-List Caption, Version, BuildNumber
          $accelerators = @()
          if ("${{ matrix.xdna }}" -eq 'true') {
            $accelerators = @(Get-PnpDevice -Class ComputeAccelerator -PresentOnly -ErrorAction Stop)
            if (-not ($accelerators | Where-Object Status -eq 'OK')) {
              throw 'This runner requires a healthy native compute accelerator.'
            }
          }
          $gpus = @(Get-PnpDevice -Class Display -PresentOnly -ErrorAction Stop |
            Where-Object InstanceId -Like 'PCI\VEN_1002&*')
          $devices = $accelerators + $gpus
          $devices | Format-Table Status, Class, FriendlyName, InstanceId -AutoSize
          foreach ($device in $devices) {
            Write-Output $device.InstanceId
            Get-PnpDeviceProperty -InstanceId $device.InstanceId -ErrorAction Stop -KeyName `
              DEVPKEY_Device_DriverVersion, DEVPKEY_Device_DriverDate, DEVPKEY_Device_DriverInfPath |
              Format-Table KeyName, Data -AutoSize
          }
          if (-not ($gpus | Where-Object Status -eq 'OK')) {
            throw 'This runner requires a healthy AMD GPU.'
          }
          if ("${{ matrix.kind }}" -eq 'amd_client') {
            (Get-Item (Join-Path $env:SystemRoot 'System32\vulkan-1.dll') -ErrorAction Stop).VersionInfo |
              Format-List FileName, FileVersion, ProductVersion
          }

      - name: Run IREE Bazel CI
        if: matrix.kind == 'repository'
        id: iree_bazel_ci
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual Studio C++ tools discovery failed.' }
          Import-Module (Join-Path $installation 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'Visual Studio x64 developer environment was not initialized.' }
          foreach ($tool in @('clang-cl.exe', 'lld-link.exe', 'llvm-lib.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:BAZEL_LLVM "bin\$tool") -PathType Leaf)) {
              throw "Missing LLVM tool: $tool"
            }
          }
          $env:CC = Join-Path $env:BAZEL_LLVM 'bin\clang-cl.exe'
          $env:CXX = $env:CC
          $env:AR = Join-Path $env:BAZEL_LLVM 'bin\llvm-lib.exe'
          $resultArgs = @()
          if ('${{ matrix.command }}' -ne 'iree-bazel-repository-build') {
            $repositoryResultsDir = Join-Path $env:RUNNER_TEMP "repository-test-results-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $resultArgs += @('--bazel-test-results-dir', $repositoryResultsDir)
          }
          $targetArgs = @()
          if ("${{ matrix.target_selector }}") {
            $targetArgs += @('--amdgpu-target', '${{ matrix.target_selector }}')
          }
          python build_tools/devtools/ci.py '${{ matrix.command }}' @targetArgs @resultArgs `
            --bazel-profile-dir "$env:RUNNER_TEMP\bazel-profiles" --keep-going
          exit $LASTEXITCODE

      - name: Build and test native AMD devices
        if: matrix.kind == 'amd_client' || matrix.kind == 'amdgpu'
        id: client_ci
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) { throw 'Visual Studio C++ tools discovery failed.' }
          $installation = $visualStudio.installationPath
          Import-Module (Join-Path $installation 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'Visual Studio x64 developer environment was not initialized.' }
          $env:BAZEL_VC = $env:VCINSTALLDIR.TrimEnd('\')
          $env:BAZEL_VC_FULL_VERSION = $env:VCToolsVersion
          if ('${{ matrix.command }}'.EndsWith('-asan')) {
            $catalog = Join-Path $env:ProgramData "Microsoft\VisualStudio\Packages\_Instances\$($visualStudio.instanceId)\catalog.json"
            $stlAsanDirectory = python build_tools/ci/windows_stl_asan.py `
              --tools-dir ($env:VCToolsInstallDir.TrimEnd('\')) --catalog $catalog `
              --output-dir "$env:HRX_OUTPUT_DIR\stl-asan"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # rules_cc reconstructs LIB from vcvarsall, so supply the companion
            # as an explicit ASAN link search path instead of editing LIB.
            "build:asan --linkopt=`"/LIBPATH:$($stlAsanDirectory.Replace('\', '/'))`"" |
              Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          }
          foreach ($tool in @('clang-cl.exe', 'lld-link.exe', 'llvm-lib.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:BAZEL_LLVM "bin\$tool") -PathType Leaf)) {
              throw "Missing LLVM tool: $tool"
            }
          }
          $env:CC = Join-Path $env:BAZEL_LLVM 'bin\clang-cl.exe'
          $env:CXX = $env:CC
          $env:AR = Join-Path $env:BAZEL_LLVM 'bin\llvm-lib.exe'
          $nativeResultsDir = Join-Path $env:RUNNER_TEMP "native-test-results-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $targetArgs = @()
          if ("${{ matrix.target_selector }}") {
            $targetArgs += @('--amdgpu-target', '${{ matrix.target_selector }}')
          }
          python build_tools/devtools/ci.py '${{ matrix.command }}' @targetArgs `
            --bazel-profile-dir "$env:RUNNER_TEMP\bazel-profiles" `
            --bazel-test-results-dir $nativeResultsDir
          exit $LASTEXITCODE

      - name: Report Windows build storage
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          Get-PSDrive -PSProvider FileSystem -ErrorAction Stop |
            Where-Object { $_.Root -match '^[A-Za-z]:\\$' -and $null -ne $_.Free } |
            Select-Object Name, Root, DisplayRoot,
              @{Name = 'FreeGiB'; Expression = {[math]::Round($_.Free / 1GB, 1)}},
              @{Name = 'UsedGiB'; Expression = {[math]::Round($_.Used / 1GB, 1)}} |
            Format-Table -AutoSize

      - name: Upload Windows build failure evidence
        timeout-minutes: 5
        continue-on-error: true
        if: ${{ always() && (steps.iree_bazel_ci.outcome == 'failure' || steps.client_ci.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-failures-${{ matrix.command }}-${{ matrix.host_toolchain }}-attempt-${{ github.run_attempt }}
          path: ${{ env.IREE_CI_FAILURE_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Bazel profiles
        continue-on-error: true
        if: ${{ always() && (steps.iree_bazel_ci.outcome != 'skipped' || steps.client_ci.outcome != 'skipped') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-profiles-windows-${{ matrix.command }}-${{ matrix.host_toolchain }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}\bazel-profiles\
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload failed test results
        if: ${{ always() && steps.iree_bazel_ci.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.command }}-${{ matrix.host_toolchain }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-test-results-${{ github.run_id }}-${{ github.run_attempt }}/**/bazel-testlogs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload native test results
        timeout-minutes: 5
        continue-on-error: true
        if: ${{ always() && steps.client_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-test-results-${{ matrix.kind }}-windows-${{ matrix.target_selector }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-test-results-${{ github.run_id }}-${{ github.run_attempt }}/**/bazel-testlogs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload native BEP observations
        timeout-minutes: 2
        continue-on-error: true
        if: ${{ always() && steps.client_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-bep-observations-${{ matrix.kind }}-windows-${{ matrix.target_selector }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-test-results-${{ github.run_id }}-${{ github.run_attempt }}/**/bep-observation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failed native BEP
        timeout-minutes: 2
        continue-on-error: true
        if: ${{ always() && steps.client_ci.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-native-bep-${{ matrix.kind }}-windows-${{ matrix.target_selector }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-test-results-${{ github.run_id }}-${{ github.run_attempt }}/.events/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  windows_cache_canary:
    name: Bazel / Windows x86-64 / Remote Cache Integrity Canary
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_cache_probe == 'integrity' }}
    runs-on: azure-windows-scale-rocm
    timeout-minutes: 30
    env:
      HRX_ARTIFACT_SET: core
      HRX_RELEASE_TYPE: nightly
      IREE_CACHE_CANARY_ARTIFACT_DIR: ${{ github.workspace }}\build\cache-canary-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      IREE_CI_PYTHON: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Select Windows build storage
        shell: powershell
        run: |
          $drives = @(
            Get-PSDrive -PSProvider FileSystem -ErrorAction Stop |
              Where-Object { $_.Root -match '^[A-Za-z]:\\$' -and $null -ne $_.Free } |
              Sort-Object Free -Descending
          )
          $preferredDrive = $drives | Where-Object Name -eq 'B' | Select-Object -First 1
          $candidateDrives = @($preferredDrive) + @($drives | Where-Object Name -ne 'B')
          $selectedDrive = $null
          foreach ($drive in $candidateDrives) {
            if (-not $drive) { continue }
            $probe = Join-Path $drive.Root ".hrx-cache-canary-write-probe-$PID"
            try {
              [IO.File]::WriteAllText($probe, '')
              Remove-Item -LiteralPath $probe -Force
              $selectedDrive = $drive
              break
            } catch {
              Remove-Item -LiteralPath $probe -Force -ErrorAction SilentlyContinue
            }
          }
          if (-not $selectedDrive) { throw 'No writable filesystem volume is available.' }
          $runKey = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $outputDir = Join-Path $selectedDrive.Root 'hrx\iree-bazel-windows'
          $probeRoot = Join-Path $outputDir "cache-canary\$runKey"
          $environment = [ordered]@{
            BAZEL_LLVM = Join-Path $env:SystemDrive 'r\lib\llvm'
            HRX_DOWNLOAD_CACHE_DIR = Join-Path $outputDir 'downloads'
            HRX_OUTPUT_DIR = $outputDir
            HRX_ROCM_ROOT = Join-Path $env:SystemDrive 'r'
            IREE_CACHE_CANARY_ARTIFACT_DIR = Join-Path $probeRoot 'evidence'
            IREE_CACHE_CANARY_CONSUMER_BACKING = Join-Path $probeRoot 'consumer-execroot'
            IREE_CACHE_CANARY_CONSUMER_OUTPUT_BASE = Join-Path $env:SystemDrive "hc\$runKey\consumer"
            IREE_CACHE_CANARY_REPOSITORY_CACHE = (Join-Path $outputDir 'caches\bazel-repository').Replace('\', '/')
            IREE_CACHE_CANARY_SEED_BACKING = Join-Path $probeRoot 'seed-execroot'
            IREE_CACHE_CANARY_SEED_OUTPUT_BASE = Join-Path $env:SystemDrive "hc\$runKey\seed"
            PIP_CACHE_DIR = Join-Path $outputDir 'caches\pip'
          }
          New-Item -ItemType Directory -Path $probeRoot -Force | Out-Null
          foreach ($entry in $environment.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          Write-Output "Selected cache-canary build volume $($selectedDrive.Root)."

      - name: Check Windows host capabilities
        shell: powershell
        run: |
          $computerSystem = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
          $computerSystem |
            Format-List Manufacturer, Model, NumberOfProcessors, NumberOfLogicalProcessors, TotalPhysicalMemory
          $bazelJobs = [Math]::Min(40, [int]$computerSystem.NumberOfLogicalProcessors)
          if ($bazelJobs -lt 1) { throw 'Windows host did not report any logical processors.' }
          "IREE_CI_BAZEL_JOBS=$bazelJobs" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python build_tools/bazel/configure.py --check-windows-host

      - name: Fetch ROCm toolchain
        shell: powershell
        run: |
          python -m pip install --upgrade boto3 zstandard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build_tools/ci/ci_core_windows.py fetch-rocm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install developer tools
        shell: powershell
        run: |
          "common --repository_cache=$env:IREE_CACHE_CANARY_REPOSITORY_CACHE" |
            Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          "build --jobs=$env:IREE_CI_BAZEL_JOBS" |
            Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          python --version
          python dev.py bazel setup --venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Seed and consume cached Windows image
        id: cache_canary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = $env:IREE_CACHE_CANARY_ARTIFACT_DIR
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          $cacheStatus = Invoke-RestMethod `
            -Uri 'http://bazelremote-svc.bazelremote-ns.svc.cluster.local:8080/status' `
            -Method Get -TimeoutSec 10
          $cacheStatus | ConvertTo-Json -Depth 8 |
            Out-File -LiteralPath (Join-Path $artifactDir 'cache-status.json') -Encoding utf8

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual Studio C++ tools discovery failed.' }
          Import-Module (Join-Path $installation 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $env:CC = Join-Path $env:BAZEL_LLVM 'bin\clang-cl.exe'
          $env:CXX = $env:CC
          $env:AR = Join-Path $env:BAZEL_LLVM 'bin\llvm-lib.exe'

          $sourcePath = 'loom/src/loom/tools/loom-link/loom-link.c'
          $source = [IO.File]::ReadAllText($sourcePath)
          $needle = 'Links Loom text and bytecode modules into one Loom module.'
          $identity = "cache canary $env:GITHUB_RUN_ID/$env:GITHUB_RUN_ATTEMPT"
          if ([regex]::Matches($source, [regex]::Escape($needle)).Count -ne 1) {
            throw "Expected exactly one cache-canary source marker in $sourcePath."
          }
          $source = $source.Replace($needle, "$needle $identity")
          [IO.File]::WriteAllText(
            (Resolve-Path $sourcePath), $source, [Text.UTF8Encoding]::new($false))

          python dev.py bazel configure `
            --//runtime/config/hal:drivers=amd-gpu,amd-xdna,task,vulkan,webgpu `
            -DIREE_ROCM_DEPENDENCY_MODE=pinned `
            -DIREE_ROCM_PATH="$env:HRX_ROCM_ROOT" `
            --//loom/config/arch:enable=aie2p,amdgpu,spirv,vm,wasm,x86 `
            --//loom/config/emit:enable=elf,spirv,vm,wasm `
            --//loom/config/execute:enable=iree_hal,iree_vm,wasm_host `
            --//loom/config/import:enable=cxx `
            --//loom/config/serve:image_codecs= `
            --//loom/config/serve:audio_codecs= `
            --//libamdf/config:enabled=true `
            --//build_tools/vulkan/config:enabled=true `
            --//build_tools/d3d12/config:enabled=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          function New-CanaryOutputBase([string]$outputBase, [string]$backing) {
            New-Item -ItemType Directory -Path $outputBase -Force | Out-Null
            New-Item -ItemType Directory -Path $backing -Force | Out-Null
            $execroot = Join-Path $outputBase 'execroot'
            if (Test-Path -LiteralPath $execroot) {
              throw "Cache-canary execroot already exists: $execroot"
            }
            New-Item -ItemType Junction -Path $execroot -Target $backing | Out-Null
          }
          New-CanaryOutputBase `
            $env:IREE_CACHE_CANARY_SEED_OUTPUT_BASE $env:IREE_CACHE_CANARY_SEED_BACKING
          New-CanaryOutputBase `
            $env:IREE_CACHE_CANARY_CONSUMER_OUTPUT_BASE $env:IREE_CACHE_CANARY_CONSUMER_BACKING

          $target = '//loom/src/loom/tools/loom-link:loom-link'
          $commonFlags = @(
            '--config=rocm-ci-cache',
            '--remote_download_outputs=all',
            '--remote_verify_downloads',
            '--noremote_cache_async',
            '--record_full_profiler_data',
            '--noslim_profile',
            '--experimental_profile_include_primary_output'
          )
          $seedProfile = Join-Path $artifactDir 'seed.profile.gz'
          bazel "--output_base=$env:IREE_CACHE_CANARY_SEED_OUTPUT_BASE" build `
            @commonFlags "--profile=$seedProfile" '--remote_upload_local_results=true' $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $seedBin = bazel "--output_base=$env:IREE_CACHE_CANARY_SEED_OUTPUT_BASE" info bazel-bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $seedExe = Join-Path $seedBin 'loom\src\loom\tools\loom-link\loom-link.exe'
          $seedItem = Get-Item -LiteralPath $seedExe -ErrorAction Stop
          $seedHash = (Get-FileHash -LiteralPath $seedItem.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

          $casCopy = Join-Path $env:RUNNER_TEMP "loom-link-$seedHash.exe"
          Invoke-WebRequest `
            -Uri "http://bazelremote-svc.bazelremote-ns.svc.cluster.local:8080/cas/$seedHash" `
            -Headers @{'Accept-Encoding' = 'identity'} -OutFile $casCopy -TimeoutSec 60
          $casItem = Get-Item -LiteralPath $casCopy -ErrorAction Stop
          $casHash = (Get-FileHash -LiteralPath $casItem.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($casHash -ne $seedHash -or $casItem.Length -ne $seedItem.Length) {
            throw "CAS bytes $casHash/$($casItem.Length) do not match seed $seedHash/$($seedItem.Length)."
          }

          $consumerProfile = Join-Path $artifactDir 'consumer.profile.gz'
          $corruptDir = Join-Path $artifactDir 'bazel-corrupt-downloads'
          New-Item -ItemType Directory -Path $corruptDir -Force | Out-Null
          bazel "--output_base=$env:IREE_CACHE_CANARY_CONSUMER_OUTPUT_BASE" build `
            @commonFlags "--profile=$consumerProfile" `
            '--remote_upload_local_results=false' '--experimental_remote_require_cached' `
            "--experimental_remote_capture_corrupted_outputs=$corruptDir" $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $consumerBin = bazel "--output_base=$env:IREE_CACHE_CANARY_CONSUMER_OUTPUT_BASE" info bazel-bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $consumerExe = Join-Path $consumerBin 'loom\src\loom\tools\loom-link\loom-link.exe'
          $consumerItem = Get-Item -LiteralPath $consumerExe -ErrorAction Stop
          $consumerHash = (Get-FileHash -LiteralPath $consumerItem.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($consumerHash -ne $seedHash -or $consumerItem.Length -ne $seedItem.Length) {
            throw "Materialized bytes $consumerHash/$($consumerItem.Length) do not match seed $seedHash/$($seedItem.Length)."
          }

          $receipt = [ordered]@{
            bazel_version = (& bazel --version)
            cache_status = $cacheStatus
            source_identity = $identity
            seed = [ordered]@{
              output_base = $env:IREE_CACHE_CANARY_SEED_OUTPUT_BASE
              execroot_backing = $env:IREE_CACHE_CANARY_SEED_BACKING
              executable = $seedItem.FullName
              length = $seedItem.Length
              sha256 = $seedHash
            }
            cas = [ordered]@{
              length = $casItem.Length
              sha256 = $casHash
            }
            consumer = [ordered]@{
              output_base = $env:IREE_CACHE_CANARY_CONSUMER_OUTPUT_BASE
              execroot_backing = $env:IREE_CACHE_CANARY_CONSUMER_BACKING
              executable = $consumerItem.FullName
              length = $consumerItem.Length
              sha256 = $consumerHash
            }
          }
          $receipt | ConvertTo-Json -Depth 8 |
            Out-File -LiteralPath (Join-Path $artifactDir 'cache-receipt.json') -Encoding utf8

          python .github/scripts/windows_cache_integrity_canary.py `
            --executable $consumerItem.FullName `
            --input loom/src/loom/tools/loom-link/testdata/dependency_direct.loom `
            --expected-sha256 $seedHash `
            --artifact-dir $artifactDir `
            --parallelism $env:IREE_CI_BAZEL_JOBS `
            --waves 100
          exit $LASTEXITCODE

      - name: Upload cache-canary evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-cache-integrity-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.IREE_CACHE_CANARY_ARTIFACT_DIR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows_cache_handoff_producer:
    name: Bazel / Windows x86-64 (via Linux) / Remote Cache Producer
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_cache_probe == 'handoff' }}
    runs-on: az-linux-scale-rocm-default-prod
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Adjust git config
        run: |
          mkdir -p "$HOME"
          git config --global --add safe.directory "$PWD"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Configure producer environment
        run: |
          output_dir="${GITHUB_WORKSPACE}/build/cache-handoff"
          {
            echo "AR=${output_dir}/rocm-root/lib/llvm/bin/llvm-ar"
            echo "CC=${output_dir}/rocm-root/lib/llvm/bin/clang"
            echo "CXX=${output_dir}/rocm-root/lib/llvm/bin/clang++"
            echo "HRX_ARTIFACT_SET=llvm"
            echo "HRX_DOWNLOAD_CACHE_DIR=${output_dir}/downloads"
            echo "HRX_OUTPUT_DIR=${output_dir}"
            echo "HRX_PYTHON=${output_dir}/python/bin/python3"
            echo "HRX_RELEASE_TYPE=nightly"
            echo "HRX_ROCM_ROOT=${output_dir}/rocm-root"
            echo "IREE_CACHE_HANDOFF_OUTPUT_BASE=${output_dir}/bazel-output"
            echo "LLVM_ROOT=${output_dir}/rocm-root/lib/llvm"
            echo "PIP_CACHE_DIR=${output_dir}/caches/pip"
            echo "WINDOWS_COMPILER_RT_ROOT=${output_dir}/windows-toolchain/compiler-rt"
            echo "WINDOWS_CROSS_ROOT=${output_dir}/windows-toolchain"
            echo "WINSDK_ROOT=${output_dir}/windows-toolchain/sdk"
          } >> "$GITHUB_ENV"

      - name: Fetch ROCm toolchain
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Install Windows SDK host tools
        run: |
          apt_options=(-o Acquire::ForceIPv4=true -o Acquire::Retries=3)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends p7zip-full

      - name: Restore Windows SDK inputs
        id: windows_toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WINDOWS_CROSS_ROOT }}
          key: windows-cross-${{ hashFiles('.github/scripts/setup_windows_cross.sh', '.github/scripts/windows-sdk-channel.json', 'build_tools/ci/windows_stl_asan.py') }}

      - name: Prepare Windows SDK inputs
        if: steps.windows_toolchain.outputs.cache-hit != 'true'
        run: bash .github/scripts/setup_windows_cross.sh

      - name: Install Bazel host tools
        run: |
          python3 dev.py bazel setup --venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure matching project graph
        run: python3 dev.py bazel configure --//runtime/config/hal:drivers=task

      - name: Populate shared cache
        run: |
          set -euo pipefail
          target='//build_tools/windows:compiler_runtime_test'
          source_path=build_tools/windows/compiler_runtime_test.cc
          printf '\n// Windows cache handoff %s/%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$source_path"

          artifact_dir="$RUNNER_TEMP/windows-cache-handoff"
          evidence_dir="$artifact_dir/evidence"
          mkdir -p "$evidence_dir"
          sha256sum "$source_path" | cut -d' ' -f1 > "$evidence_dir/source.sha256"
          cp .bazelrc.configured "$evidence_dir/configured.bazelrc"
          bazel --version > "$evidence_dir/bazel-version.txt"
          curl --fail --silent --show-error \
            http://bazelremote-svc.bazelremote-ns.svc.cluster.local:8080/status \
            > "$evidence_dir/cache-status.json"

          common_flags=(
            --config=windows-x86_64
            --config=windows-clang-cl
            --config=rocm-ci-cache
            --cpu=x64_windows
            --host_cpu=k8
            --host_platform=//build_tools/windows/cache_handoff:linux_x86_64
            --action_env=PATH=/bin:/usr/bin:/usr/local/bin
            --host_action_env=PATH=/bin:/usr/bin:/usr/local/bin
            --extra_toolchains=//build_tools/windows/cache_handoff:linux_x86_64_host_cc,//build_tools/windows/cache_handoff:windows_x86_64_clang_cl
            --extra_execution_platforms=//build_tools/windows/cache_handoff:linux_x86_64,//build_tools/windows:windows_x86_64
            --@bazel_tools//tools/test:incompatible_use_default_test_toolchain=true
            --remote_download_outputs=all
            --remote_verify_downloads
            --noremote_cache_async
          )
          bazel "--output_base=$IREE_CACHE_HANDOFF_OUTPUT_BASE" build \
            "${common_flags[@]}" \
            --remote_upload_local_results=true \
            --profile="$evidence_dir/producer.profile.gz" \
            --execution_log_json_file="$evidence_dir/producer-execution.json" \
            "$target"

          query_file="$evidence_dir/cpp-actions.aquery"
          printf '%s\n' \
            'mnemonic("CppCompile|CppLink", //build_tools/windows:compiler_runtime_test)' \
            > "$query_file"
          bazel "--output_base=$IREE_CACHE_HANDOFF_OUTPUT_BASE" aquery \
            "${common_flags[@]}" --output=text --query_file="$query_file" \
            > "$evidence_dir/producer-aquery.txt"
          grep '^  ActionKey:' "$evidence_dir/producer-aquery.txt" \
            > "$evidence_dir/producer-action-keys.txt"
          test "$(wc -l < "$evidence_dir/producer-action-keys.txt")" -eq 2

          output_base="$(bazel "--output_base=$IREE_CACHE_HANDOFF_OUTPUT_BASE" info output_base)"
          toolchain_repo="$output_base/external/+windows_toolchain_repository+iree_windows_toolchain"
          test -f "$toolchain_repo/BUILD.bazel"
          mkdir -p "$artifact_dir/toolchain"
          cp --archive --dereference "$toolchain_repo/." "$artifact_dir/toolchain/"
          host_toolchain_repo="$output_base/external/rules_cc++cc_configure_extension+local_config_cc"
          test -f "$host_toolchain_repo/BUILD"
          mkdir -p "$artifact_dir/host-toolchain"
          cp --archive --dereference "$host_toolchain_repo/." "$artifact_dir/host-toolchain/"
          du --human-readable --summarize "$artifact_dir/toolchain"

      # The dereferenced repository is a one-run diagnostic bootstrap. Remote
      # action-cache hits cannot bootstrap external source repositories.
      - name: Upload producer closure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-cache-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-cache-handoff/
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  windows_cache_handoff_consumer:
    name: Bazel / Windows x86-64 / Remote Cache Handoff
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_cache_probe == 'handoff' }}
    needs: windows_cache_handoff_producer
    runs-on: azure-windows-scale-rocm
    timeout-minutes: 30
    env:
      HRX_ARTIFACT_SET: core
      HRX_RELEASE_TYPE: nightly
      IREE_CI_PYTHON: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Select handoff storage
        shell: powershell
        run: |
          $drive = Get-PSDrive -Name B -PSProvider FileSystem -ErrorAction Stop
          $probe = Join-Path $drive.Root ".hrx-cache-handoff-write-probe-$PID"
          [IO.File]::WriteAllText($probe, '')
          Remove-Item -LiteralPath $probe -Force
          $runKey = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $root = Join-Path $drive.Root "hrx\cache-handoff\$runKey"
          $outputBase = Join-Path $env:SystemDrive "hc\$runKey\consumer"
          $environment = [ordered]@{
            BAZEL_LLVM = Join-Path $env:SystemDrive 'r\lib\llvm'
            HRX_DOWNLOAD_CACHE_DIR = Join-Path $root 'downloads'
            HRX_OUTPUT_DIR = $root
            HRX_ROCM_ROOT = Join-Path $env:SystemDrive 'r'
            IREE_CACHE_HANDOFF_ARTIFACT_ROOT = Join-Path $root 'producer'
            IREE_CACHE_HANDOFF_EVIDENCE = Join-Path $root 'consumer-evidence'
            IREE_CACHE_HANDOFF_EXECROOT_BACKING = Join-Path $root 'execroot'
            IREE_CACHE_HANDOFF_OUTPUT_BASE = $outputBase.Replace('\', '/')
            IREE_CACHE_HANDOFF_REPOSITORY_CACHE = (Join-Path $root 'repository-cache').Replace('\', '/')
            PIP_CACHE_DIR = Join-Path $root 'pip-cache'
          }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          New-Item -ItemType Directory -Path $environment.IREE_CACHE_HANDOFF_EVIDENCE -Force | Out-Null
          foreach ($entry in $environment.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Fetch ROCm toolchain
        shell: powershell
        run: |
          python -m pip install --upgrade boto3 zstandard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build_tools/ci/ci_core_windows.py fetch-rocm
          exit $LASTEXITCODE

      - name: Download producer closure
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-cache-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.IREE_CACHE_HANDOFF_ARTIFACT_ROOT }}

      - name: Install Bazel host tools
        shell: powershell
        run: |
          $outputBase = $env:IREE_CACHE_HANDOFF_OUTPUT_BASE.Replace('/', '\')
          $execroot = Join-Path $outputBase 'execroot'
          New-Item -ItemType Directory -Path $outputBase -Force | Out-Null
          New-Item -ItemType Directory -Path $env:IREE_CACHE_HANDOFF_EXECROOT_BACKING -Force | Out-Null
          if (Test-Path -LiteralPath $execroot) {
            throw "Cache-handoff execroot already exists: $execroot"
          }
          New-Item -ItemType Junction -Path $execroot `
            -Target $env:IREE_CACHE_HANDOFF_EXECROOT_BACKING | Out-Null
          "common --repository_cache=$env:IREE_CACHE_HANDOFF_REPOSITORY_CACHE" |
            Out-File -FilePath .bazelrc.local -Encoding ascii -Append
          python dev.py bazel setup --venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure matching project graph
        shell: powershell
        run: |
          python dev.py bazel configure --//runtime/config/hal:drivers=task
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $producerConfig = Join-Path $env:IREE_CACHE_HANDOFF_ARTIFACT_ROOT 'evidence\configured.bazelrc'
          $producerText = (Get-Content -Raw -LiteralPath $producerConfig).Replace("`r`n", "`n")
          $consumerText = (Get-Content -Raw -LiteralPath .bazelrc.configured).Replace("`r`n", "`n")
          if ($producerText -ne $consumerText) {
            throw 'Producer and consumer project configurations differ.'
          }

      - name: Consume cached image and run native test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = '//build_tools/windows:compiler_runtime_test'
          $sourcePath = 'build_tools/windows/compiler_runtime_test.cc'
          [IO.File]::AppendAllText(
            (Resolve-Path $sourcePath),
            "`n// Windows cache handoff $env:GITHUB_RUN_ID/$env:GITHUB_RUN_ATTEMPT`n",
            [Text.UTF8Encoding]::new($false))
          $sourceHash = (Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSourceHash = (Get-Content -Raw (Join-Path $env:IREE_CACHE_HANDOFF_ARTIFACT_ROOT 'evidence\source.sha256')).Trim()
          if ($sourceHash -ne $expectedSourceHash) {
            throw "Producer and consumer source bytes differ: $sourceHash != $expectedSourceHash"
          }

          $toolchainRoot = (Resolve-Path (Join-Path $env:IREE_CACHE_HANDOFF_ARTIFACT_ROOT 'toolchain')).Path.Replace('\', '/')
          $hostToolchainRoot = (Resolve-Path (Join-Path $env:IREE_CACHE_HANDOFF_ARTIFACT_ROOT 'host-toolchain')).Path.Replace('\', '/')
          $evidenceDir = $env:IREE_CACHE_HANDOFF_EVIDENCE
          $commonFlags = @(
            '--config=windows-x86_64',
            '--config=windows-clang-cl',
            '--config=rocm-ci-cache',
            '--cpu=x64_windows',
            '--host_cpu=k8',
            '--host_platform=//build_tools/windows/cache_handoff:linux_x86_64',
            '--action_env=PATH=/bin:/usr/bin:/usr/local/bin',
            '--host_action_env=PATH=/bin:/usr/bin:/usr/local/bin',
            "--override_repository=iree_windows_toolchain=$toolchainRoot",
            "--override_repository=local_config_cc=$hostToolchainRoot",
            '--extra_toolchains=//build_tools/windows/cache_handoff:linux_x86_64_host_cc,//build_tools/windows/cache_handoff:windows_x86_64_clang_cl',
            '--extra_execution_platforms=//build_tools/windows/cache_handoff:linux_x86_64,//build_tools/windows:windows_x86_64',
            '--@bazel_tools//tools/test:incompatible_use_default_test_toolchain=true',
            '--remote_download_outputs=all',
            '--remote_verify_downloads',
            '--noremote_cache_async'
          )
          $queryFile = Join-Path $env:IREE_CACHE_HANDOFF_ARTIFACT_ROOT 'evidence\cpp-actions.aquery'
          $consumerAquery = Join-Path $evidenceDir 'consumer-aquery.txt'
          bazel "--output_base=$env:IREE_CACHE_HANDOFF_OUTPUT_BASE" aquery `
            @commonFlags '--output=text' "--query_file=$queryFile" |
              Out-File -LiteralPath $consumerAquery -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $producerKeys = @(
            Get-Content -LiteralPath (Join-Path $env:IREE_CACHE_HANDOFF_ARTIFACT_ROOT 'evidence\producer-action-keys.txt')
          )
          $consumerKeys = @(
            Select-String -LiteralPath $consumerAquery -Pattern '^  ActionKey:' |
              ForEach-Object { $_.Line }
          )
          if ($producerKeys.Count -ne 2 -or $consumerKeys.Count -ne 2 -or
              (Compare-Object $producerKeys $consumerKeys)) {
            throw "Producer and consumer configured C++ action keys differ.`nProducer: $producerKeys`nConsumer: $consumerKeys"
          }

          $executionLog = Join-Path $evidenceDir 'consumer-execution.json'
          $profile = Join-Path $evidenceDir 'consumer.profile.gz'
          bazel "--output_base=$env:IREE_CACHE_HANDOFF_OUTPUT_BASE" test `
            @commonFlags `
            '--remote_upload_local_results=false' `
            '--experimental_remote_require_cached' `
            '--strategy=TestRunner=local' `
            '--cache_test_results=no' `
            "--profile=$profile" `
            "--execution_log_json_file=$executionLog" `
            '--test_output=all' `
            $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $receipt = Join-Path $evidenceDir 'cache-hit-receipt.json'
          @'
          import json
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          decoder = json.JSONDecoder()
          entries = []
          position = 0
          while position < len(text):
              while position < len(text) and text[position].isspace():
                  position += 1
              if position == len(text):
                  break
              entry, position = decoder.raw_decode(text, position)
              entries.append(entry)
          build_entries = [
              entry
              for entry in entries
              if entry.get("mnemonic") in ("CppCompile", "CppLink")
          ]
          if len(build_entries) != 2:
              raise SystemExit(
                  f"Expected two C++ cache entries, found {len(build_entries)}."
              )
          non_remote_hits = [
              entry
              for entry in build_entries
              if entry.get("runner") != "remote cache hit"
          ]
          if non_remote_hits:
              raise SystemExit(
                  "C++ actions did not come from the remote cache: "
                  + json.dumps(non_remote_hits, indent=2)
              )
          receipt = [
              {
                  key: entry.get(key)
                  for key in ("mnemonic", "targetLabel", "runner", "cacheHit", "digest")
              }
              for entry in build_entries
          ]
          Path(sys.argv[2]).write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          '@ | python - $executionLog $receipt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload consumer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-cache-handoff-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.IREE_CACHE_HANDOFF_EVIDENCE }}
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

  cmake_linux:
    name: CMake / Linux x86-64 / Clang / RelWithDebInfo
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.windows_cache_probe == 'none') }}
    concurrency:
      group: iree-cmake-linux-repository-build-${{ (github.event_name == 'push' && github.ref) || github.run_id }}
      cancel-in-progress: true
    runs-on: az-linux-scale-rocm-default-prod
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Adjust git config
        run: |
          mkdir -p "$HOME"
          git config --global --add safe.directory "$PWD"

      - name: Configure build environment
        run: |
          output_dir="${GITHUB_WORKSPACE}/build/iree-cmake"
          {
            echo "AR=${output_dir}/rocm-root/lib/llvm/bin/llvm-ar"
            echo "CC=${output_dir}/rocm-root/lib/llvm/bin/clang"
            echo "CXX=${output_dir}/rocm-root/lib/llvm/bin/clang++"
            echo "HRX_ARTIFACT_SET=core"
            echo "HRX_DOWNLOAD_CACHE_DIR=${output_dir}/downloads"
            echo "HRX_OUTPUT_DIR=${output_dir}"
            echo "HRX_PYTHON=${output_dir}/python/bin/python3"
            echo "HRX_RELEASE_TYPE=nightly"
            echo "HRX_ROCM_ROOT=${output_dir}/rocm-root"
            echo "PIP_CACHE_DIR=${output_dir}/caches/pip"
          } >> "$GITHUB_ENV"

      - name: Fetch ROCm toolchain
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Install CMake host tools
        run: |
          python3 --version
          python3 dev.py cmake setup --venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check tool versions
        run: |
          cmake --version
          ctest --version
          ninja --version
          bash .github/scripts/check_host_toolchain.sh --expect-artifact
          bash .github/scripts/check_rocm_device_toolchain.sh
          test -d "${HRX_ROCM_ROOT}/include"

      - name: Run IREE CMake CI
        id: iree_cmake_ci
        run: >-
          python3 build_tools/devtools/ci.py
          iree-cmake-repository-build --keep-going

      - name: Upload failed test results
        if: ${{ always() && steps.iree_cmake_ci.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-results-linux-iree-cmake-repository-build-attempt-${{ github.run_attempt }}
          path: |
            build/ci/**/Testing/Temporary/
            build/ci/**/test_tmpdir/**/test.xml
          if-no-files-found: warn
          retention-days: 7

  cmake_windows_cross:
    name: CMake / Windows x86-64 (via Linux) / Clang CL / RelWithDebInfo
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.windows_cache_probe == 'none') }}
    concurrency:
      group: iree-cmake-windows-cross-${{ (github.event_name == 'push' && github.ref) || github.run_id }}
      cancel-in-progress: true
    runs-on: az-linux-scale-rocm-default-prod
    timeout-minutes: 15
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
    defaults:
      run:
        shell: bash
    env:
      AR: /usr/lib/llvm-22/bin/llvm-ar
      CC: /usr/lib/llvm-22/bin/clang
      CXX: /usr/lib/llvm-22/bin/clang++
      LLVM_APT_VERSION: "1:22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80"
      LLVM_ROOT: /usr/lib/llvm-22
      WINDOWS_CROSS_ROOT: ${{ github.workspace }}/build/iree-cmake-windows/toolchain
      WINSDK_ROOT: ${{ github.workspace }}/build/iree-cmake-windows/toolchain/sdk
      WINDOWS_COMPILER_RT_ROOT: ${{ github.workspace }}/build/iree-cmake-windows/toolchain/compiler-rt
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure workspace
        run: |
          git config --global --add safe.directory "$PWD"
          echo "$PWD/build/iree-cmake-windows/host-tools" >> "$GITHUB_PATH"
          echo "$LLVM_ROOT/bin" >> "$GITHUB_PATH"

      - name: Install compiler and build tools
        run: |
          llvm_key_path=.github/scripts/llvm_snapshot_archive_key.asc
          echo "8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d  $llvm_key_path" | sha256sum --check
          sudo install -m 644 "$llvm_key_path" /usr/share/keyrings/llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm.list
          apt_options=(-o Acquire::ForceIPv4=true -o Acquire::Retries=3)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends \
            "clang-22=$LLVM_APT_VERSION" "lld-22=$LLVM_APT_VERSION" \
            "llvm-22=$LLVM_APT_VERSION" "libclang-rt-22-dev=$LLVM_APT_VERSION" \
            g++-13 p7zip-full python3-venv
          python3 dev.py cmake setup --venv
          mkdir -p build/iree-cmake-windows/host-tools
          python3 build_tools/devtools/install.py bazelisk \
            --bin-dir build/iree-cmake-windows/host-tools
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Restore Windows SDK inputs
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WINDOWS_CROSS_ROOT }}
          key: windows-cross-${{ hashFiles('.github/scripts/setup_windows_cross.sh', '.github/scripts/windows-sdk-channel.json', 'build_tools/ci/windows_stl_asan.py') }}

      - name: Prepare Windows SDK inputs
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: bash .github/scripts/setup_windows_cross.sh

      - name: Select matching Windows compiler runtime
        run: |
          test "$("$LLVM_ROOT/bin/clang" -dumpversion)" = 22.1.8
          resource_dir="$("$LLVM_ROOT/bin/clang" -print-resource-dir)"
          sudo install -D \
            "$WINDOWS_COMPILER_RT_ROOT/clang_rt.builtins-x86_64.lib" \
            "$resource_dir/lib/windows/clang_rt.builtins-x86_64.lib"

      - name: Build current host generators
        run: |
          bazel build --config=loom-sdk --config=opt \
            --//loom/config/import:enable=cxx \
            --//loom/config/import/cxx:embed_includes=true \
            --cxxopt=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13 \
            --linkopt=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13 \
            //build_tools/embed_data:embed_data \
            //loom/src/loom/tools/loom-compile \
            //loom/src/loom/tools/loom-import-cxx \
            //loom/src/loom/tools/loom-link
          host_tools="$PWD/build/iree-cmake-windows/host-tools"
          install -m 0755 bazel-bin/build_tools/embed_data/embed_data \
            "$host_tools/iree-c-embed-data"
          install -m 0755 bazel-bin/loom/src/loom/tools/loom-compile/loom-compile \
            "$host_tools/loom-compile"
          install -m 0755 bazel-bin/loom/src/loom/tools/loom-import-cxx/loom-import-cxx \
            "$host_tools/loom-import-cxx"
          install -m 0755 bazel-bin/loom/src/loom/tools/loom-link/loom-link \
            "$host_tools/loom-link"

      - name: Configure Windows Loom products
        run: |
          python3 dev.py \
            --cmake-build-dir build/iree-cmake-windows/build \
            cmake configure \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build_tools/windows/clang_cl_cross_toolchain.cmake" \
            -DAMDF_BUILD=ON \
            -DIREE_BUILD_BENCHMARKS=OFF \
            -DIREE_BUILD_TESTS=OFF \
            -DIREE_HAL_DRIVER_AMD=ON \
            -DIREE_HAL_DRIVER_AMD_GPU=ON \
            -DIREE_HAL_DRIVER_AMD_XDNA=ON \
            -DIREE_HAL_DRIVER_AMDGPU=OFF \
            -DIREE_HAL_DRIVER_TASK=ON \
            -DIREE_HAL_DRIVER_VULKAN=OFF \
            -DIREE_HAL_DRIVER_WEBGPU=OFF \
            -DIREE_HOST_BIN_DIR="$PWD/build/iree-cmake-windows/host-tools" \
            -DLOOM_BUILD=ON \
            -DLOOM_IMPORT_CXX=ON \
            -DLOOM_LINK_SHARED_TOOLS=ON \
            -DLOOM_SERVE_AUDIO_CODECS= \
            -DLOOM_SERVE_IMAGE_INPUT=OFF \
            -DLOOM_TARGET_DEFAULT=ON \
            -DLIBHRX_BUILD=OFF

      - name: Build Windows Loom products
        run: |
          python3 dev.py \
            --cmake-build-dir build/iree-cmake-windows/build \
            cmake build loom-compile loom-import-cxx loom-link loom-run --parallel

      - name: Inspect Windows product closure
        run: |
          product_dir=build/iree-cmake-windows/build/bin
          for product in iree.dll loomc.dll loom-compile.exe loom-import-cxx.exe loom-link.exe loom-run.exe; do
            "$LLVM_ROOT/bin/llvm-readobj" --file-headers "$product_dir/$product" |
              grep -F 'Machine: IMAGE_FILE_MACHINE_AMD64' >/dev/null
          done
          "$LLVM_ROOT/bin/llvm-readobj" --coff-exports "$product_dir/iree.dll" |
            grep -F 'Name: iree_hal_device_destroy' >/dev/null
          "$LLVM_ROOT/bin/llvm-readobj" --coff-exports "$product_dir/loomc.dll" |
            grep -F 'Name: loomc_compile_module' >/dev/null
          "$LLVM_ROOT/bin/llvm-readobj" --needed-libs "$product_dir/loom-compile.exe" |
            grep -F 'loomc.dll' >/dev/null
