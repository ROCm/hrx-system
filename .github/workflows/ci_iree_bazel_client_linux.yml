name: CI IREE Bazel / Linux / AMD RDNA+XDNA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".bazelrc"
      - ".github/scripts/**"
      - ".github/workflows/ci_iree_bazel_client_linux.yml"
      - "BUILD.bazel"
      - "BUILDING.md"
      - "MODULE.*"
      - "dev.py"
      - "requirements-dev*"
      - "build_tools/**"
      - "runtime/**"
      - "loom/**"
      - "libamdf/**"
      - "experimental/xdna/**"
      - "third_party/**"
  push:
    branches: [main, main-staging]
    paths:
      - ".bazelrc"
      - ".github/scripts/**"
      - ".github/workflows/ci_iree_bazel_client_linux.yml"
      - "BUILD.bazel"
      - "BUILDING.md"
      - "MODULE.*"
      - "dev.py"
      - "requirements-dev*"
      - "build_tools/**"
      - "runtime/**"
      - "loom/**"
      - "libamdf/**"
      - "experimental/xdna/**"
      - "third_party/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: ASAN
    runs-on: linux-gfx1150-gpu-rocm-npu
    timeout-minutes: 45
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: >-
        --device=/dev/accel/accel0
        --ulimit memlock=-1:-1
        --security-opt seccomp=unconfined
    env:
      AR: ${{ github.workspace }}/build/iree-bazel-client/rocm-root/lib/llvm/bin/llvm-ar
      CC: ${{ github.workspace }}/build/iree-bazel-client/rocm-root/lib/llvm/bin/clang
      CXX: ${{ github.workspace }}/build/iree-bazel-client/rocm-root/lib/llvm/bin/clang++
      HRX_ARTIFACT_SET: core
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/build/iree-bazel-client/downloads
      HRX_OUTPUT_DIR: ${{ github.workspace }}/build/iree-bazel-client
      HRX_PYTHON: ${{ github.workspace }}/build/iree-bazel-client/python/bin/python3
      HRX_RELEASE_TYPE: nightly
      HRX_ROCM_ROOT: ${{ github.workspace }}/build/iree-bazel-client/rocm-root
      PIP_CACHE_DIR: ${{ github.workspace }}/build/iree-bazel-client/caches/pip
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: |
          mkdir -p "$HOME"
          git config --global --add safe.directory "$PWD"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Fetch host LLVM toolchain
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Install developer tools
        run: |
          python3 dev.py bazel setup --venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check toolchains and native device access
        run: |
          bash .github/scripts/check_host_toolchain.sh --expect-rocm
          test -r /dev/accel/accel0 && test -w /dev/accel/accel0

      - name: Build and test the AMD client
        id: client_ci
        run: |
          python3 build_tools/devtools/ci.py iree-bazel-amd-client-asan \
            --bazel-profile-dir "${RUNNER_TEMP}/bazel-profiles"

      - name: Upload Bazel profiles
        continue-on-error: true
        if: ${{ always() && steps.client_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-profiles-amd-client-linux-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-profiles/*.profile.gz
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Upload native test results
        if: ${{ always() && steps.client_ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-test-results-amd-client-linux-attempt-${{ github.run_attempt }}
          path: |
            bazel-testlogs/libamdf/**/test.log
            bazel-testlogs/libamdf/**/test.xml
            bazel-testlogs/experimental/xdna/**/test.log
            bazel-testlogs/experimental/xdna/**/test.xml
          if-no-files-found: warn
          retention-days: 7
