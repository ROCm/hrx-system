name: Documentation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "dev.py"
      - "requirements-analysis.lock.txt"
      - "requirements-dev.lock.txt"
      - "build_tools/devtools/**"
      - "loom/binding/c/**"
      - "loom/docs/**"
      - "loom/py/loom/**"
      - "loom/src/loom/editor/textmate/**"
  push:
    branches:
      - main
      - main-staging
    paths:
      - ".github/workflows/docs.yml"
      - "dev.py"
      - "requirements-analysis.lock.txt"
      - "requirements-dev.lock.txt"
      - "build_tools/devtools/**"
      - "loom/binding/c/**"
      - "loom/docs/**"
      - "loom/py/loom/**"
      - "loom/src/loom/editor/textmate/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_docs:
    name: Linux / Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock.txt
            requirements-analysis.lock.txt
            loom/docs/requirements.lock.txt

      - name: Install documentation tools
        run: python3 dev.py setup --docs

      - name: Build documentation
        run: |
          PYTHONPATH=loom/docs .venv/bin/python -m unittest \
            loom_docs.highlight_test
          .venv/bin/python loom/docs/build.py build \
            --site-dir build/loom-pages/loom
          test -f build/loom-pages/loom/index.html
          test -f build/loom-pages/loom/reference/dialects/index.html
          test -f build/loom-pages/loom/reference/c-api/generated/index.html

      - name: Upload review artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/loom-pages
          retention-days: 7
