<html lang="en" class="chat">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <title>Conversation · Loom Serve</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="chat.js"></script>
</head>
<body>
  <header class="topbar">
  <a class="brand" href="./" aria-label="Loom Serve">loom <span>/ serve</span></a>
  <nav aria-label="Workspace"><span aria-current="page">Conversation</span><a href="./">Telemetry</a></nav>

  <span id="endpoint"></span>
  <a id="privacy" href="chat.html?private">Incognito</a>
</header>
  <main aria-label="Conversation" inert aria-busy="true">
    <header class="threadbar">
      <div class="pickers">
        <label id="project-picker">Project <select id="projects">
          <option value="+">New project…</option>
          <optgroup id="project-list" label="Projects"></optgroup>
          <hr><option value="-">Delete project…</option>
        </select></label>
        <label class="chat-picker">Chat <select id="threads">
          <option value="+">New chat</option>
          <option value="find">Find chat…</option>
          <option value="import">Import chat…</option>
          <option id="draft-chat" hidden>Unsaved draft</option>
          <optgroup id="pinned-chats" label="Pinned chats" hidden></optgroup>
          <optgroup id="recent-chats" label="Recent chats"></optgroup>
          <optgroup label="Current chat">
            <option value="rename">Rename chat…</option>
            <option id="pin-chat" value="pin">Pin chat</option>
            <option id="delete-chat" value="-">Delete chat…</option>
          </optgroup>
        </select></label>
        <div class="chat-actions"><button id="new" aria-label="New chat">New<span> chat</span></button><button id="import-chat" aria-label="Import chat">Import<span> chat</span></button><button id="export-chat" aria-label="Export chat">Export<span> chat</span></button></div>
        <button id="inspector-toggle" aria-controls="inspector" aria-expanded="false">Inspector</button>
      </div>
      <form id="project-form" autocomplete="off" hidden>
        <label for="project-name">New project</label><input id="project-name" maxlength="90" required>
        <button id="create-project">Create</button><button type="button" id="cancel-project">Cancel</button>
      </form>
      <div id="branch" hidden></div>
    </header>
    <div id="transcript" role="region" aria-label="Messages" tabindex="0"></div>
    <form id="compose" autocomplete="off">
      <div id="files" class="attachments"></div>
      <textarea id="prompt" rows="3" aria-label="Message" placeholder="Message the selected model…" autofocus></textarea>
      <div class="toolbar">
        <label class="model-picker">Model <select id="model"></select></label>
        <label class="button" id="attach" title="Attach or drop text, source files, or supported images">Attach files<input id="upload" type="file" multiple></label>
        <button id="mic" type="button" hidden>Dictate</button>
        <button id="stop" type="button" hidden>Stop</button>
        <button id="send" class="primary" type="submit">Send</button>
      </div>
      <div class="compose-status">
        <p id="notice" role="status"></p>
        <span class="token-count" hidden title="Input size for the next request, including history, instructions, tools, and attachments">Input tokens <output id="prompt-tokens" for="prompt" aria-label="Input tokens" aria-live="off">—</output><span id="context-window" title="Model context window"></span></span>
      </div>
    </form>
    <aside id="inspector" aria-label="Inspector" tabindex="0">
      <section>
        <div class="settings-heading"><h2>Model settings</h2><button id="refresh">Refresh models</button></div>
        <div class="options">
          <label id="token-setting" title="Generated tokens, including reasoning. Auto fits the model default to the remaining context.">Output limit<input id="limit" name="max_tokens" type="number" min="1" step="1" placeholder="Model default"></label>
          <label id="size-setting" hidden>Image size<input id="size" name="size" pattern="[1-9][0-9]*x[1-9][0-9]*" placeholder="WIDTHxHEIGHT"></label>
          <label>Seed<input id="seed" name="seed" inputmode="numeric" placeholder="Model default"></label>
          <label id="effort-setting" hidden>Reasoning<select id="effort" name="reasoning_effort"></select></label>
        </div>
        <details id="prompt-options"><summary>Prompts</summary>
          <div class="prompt-label"><label for="system">System instructions</label><span class="token-count" hidden title="Text tokens before chat formatting"><output id="system-tokens" for="system" aria-label="System instruction tokens" aria-live="off">—</output> tok</span></div>
          <textarea id="system" name="system" rows="3"></textarea>
          <div class="prompt-label"><label for="template">User prompt template</label><span class="token-count" hidden title="Text tokens after inserting the current draft"><output id="template-tokens" for="template prompt" aria-label="Expanded user prompt tokens" aria-live="off">—</output> tok</span></div>
          <textarea id="template" name="template" rows="2" placeholder="{{input}}"></textarea>
        </details>
        <details id="sampling"><summary>Sampling</summary>
          <div class="options">
            <label>Temperature<input id="temperature" name="temperature" type="number" min="0" step="any" placeholder="Default"></label>
            <label>Top p<input id="top-p" name="top_p" type="number" min="0" max="1" step="any" placeholder="Default"></label>
            <label>Top k<input id="top-k" name="top_k" type="number" min="0" step="1" placeholder="Default"></label>
            <label>Frequency penalty<input id="frequency" name="frequency_penalty" type="number" step="any" placeholder="Default"></label>
            <label>Presence penalty<input id="presence" name="presence_penalty" type="number" step="any" placeholder="Default"></label>
          </div>
          <label>Stop sequences · one per line<textarea id="stops" name="stop" rows="2"></textarea></label>
        </details>
        <details id="tools-setting"><summary title="Tool changes are sent with your next input">Tools</summary>
          <label class="check" title="Run enabled built-in tools and send their results back to the model"><input id="auto-tools" name="autoTools" type="checkbox" checked> Auto-run and return results</label>
          <label class="check"><input id="html-tool" name="htmlTool" type="checkbox"> HTML preview</label>
          <label class="check" title="Run JavaScript in an offline browser worker"><input id="code-tool" name="codeTool" type="checkbox"> Code mode (JavaScript)</label>
          <label id="image-tool-setting" hidden>Image generation<select id="image-tool" name="imageModel"><option value="">Off</option></select></label>
          <label title="Offer additional functions to the model. Supply their results in the transcript.">Function schemas · JSON<textarea id="functions" name="functions" rows="2" placeholder='[{"type":"function","function":{"name":"…"}}]'></textarea></label>
        </details>
        <details id="audio-settings"><summary>Voice</summary>
          <label id="recognizer-setting" hidden>Dictation model<select id="recognizer" name="recognizer"></select></label>
          <label class="button" id="transcribe-file">Transcribe audio file<input type="file" id="recording" accept=".wav,.mp3,.flac,audio/wav,audio/mpeg,audio/flac"></label>
          <label id="reader-setting">Read aloud with<select id="reader" name="reader"></select></label>
          <label id="voice-setting">Voice ID<input id="voice" name="voice" autocomplete="off" placeholder="Deployment voice"></label>
          <label id="speed-setting">Speech speed<input id="speed" name="speed" type="number" min=".25" max="4" step=".05" placeholder="1.0"></label>
          <button id="voice-chat" title="Listen between replies. A pause sends the turn to the chat model.">Start turn-based voice chat</button>
        </details>
        <details id="preset-options"><summary>Presets</summary>
          <label>Apply preset<select id="presets"></select></label>
          <div class="row-actions"><button id="new-preset">Save preset…</button><button id="remove-preset" disabled>Remove preset…</button></div>
        </details>
        <div class="row-actions"><button id="save-settings">Save to chat</button><button id="defaults">Set project defaults</button></div>
      </section>
      <section id="turn-inspector" hidden><h2>Turn inspector</h2>
        <dl id="metrics"></dl>
        <canvas id="trace" width="500" height="60" aria-label="Arrival times of streamed events"></canvas>
        <span class="caption">Stream arrivals · elapsed time</span>
        <div id="turn-history" hidden>
          <h2>Tokens by turn</h2><div id="turns" aria-label="Inspect a turn"></div>
          <span class="caption legend"><span>Fresh</span><span>Cached</span><span>Output</span></span>
        </div>
      </section>
      <div class="keys"><kbd>Ctrl ↵</kbd> send <kbd>Ctrl K</kbd> find chat <kbd>Esc</kbd> stop <kbd>/export</kbd> download chat</div>
    </aside>
  </main>
  <dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-detail">
    <form method="dialog">
      <h2 id="delete-title"></h2><p id="delete-detail"></p>
      <div><button value="cancel" autofocus>Cancel</button><button id="confirm-delete" value="delete"></button></div>
    </form>
  </dialog>
  <dialog id="action-dialog" aria-labelledby="action-title">
    <form><h2 id="action-title"></h2><div id="action-fields"></div>
      <div class="dialog-actions"><button type="button" id="dismiss">Cancel</button><button id="apply" type="submit"></button></div>
    </form>
  </dialog>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
</body>
</html>
